<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Drift Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation; /* Solves fast-tap delay inside watchOS web views */
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: -apple-system, sans-serif;
            padding: 4px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 92%;
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            height: 16px;
            z-index: 5;
        }
        #score-val { color: #34c759; }
        #speed-val { color: #ff9500; }

        #view-wrapper {
            position: relative;
            width: 95vw;
            height: 54vh;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #wheel-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 32vh;
            position: relative;
        }
        #steering-wheel {
            width: 80px;
            height: 80px;
            border: 8px solid #2d2d30;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 30%, #222 70%);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 3px 5px rgba(0,0,0,0.5);
            touch-action: none;
            z-index: 2;
        }
        #steering-wheel::before {
            content: '';
            width: 18px;
            height: 18px;
            background: #444;
            border: 2px solid #555;
            border-radius: 50%;
            position: absolute;
            z-index: 3;
        }
        .spoke { position: absolute; background: #2d2d30; }
        .spoke-h { width: 64px; height: 6px; top: 37px; left: 0px; }
        .spoke-v { width: 6px; height: 32px; bottom: 0px; left: 37px; }

        .touch-pedal {
            position: absolute;
            bottom: 0;
            width: 52px;
            height: 90%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.2);
            font-size: 0.55rem;
            font-weight: bold;
            border-radius: 6px;
        }
        #brake-zone { left: 4px; background: rgba(255, 59, 48, 0.06); }
        #gas-zone { right: 4px; background: rgba(52, 199, 89, 0.06); }
    </style>
</head>
<body>

    <div id="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div><span id="speed-val">0</span> MPH</div>
    </div>

    <div id="view-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="wheel-container">
        <div id="brake-zone" class="touch-pedal">BRAKE</div>
        <div id="steering-wheel">
            <div class="spoke spoke-h"></div>
            <div class="spoke spoke-v"></div>
        </div>
        <div id="gas-zone" class="touch-pedal">GAS</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        let playerX = 0; 
        let score = 0;
        let speed = 40; 
        let baseSpeed = 40;
        let currentTargetSpeed = 40;
        let gameOver = false;
        let roadTracker = 0;

        let roadCurvature = 0;      
        let targetCurvature = 0;    
        let curveTimer = 0;
        let trackPosition = 0;      
        let driftAngle = 0;         
        let isDrifting = false;
        let screenShake = 0;

        let obstacles = [];
        let spawnTimer = 0;

        let isDrawing = false;
        let startAngle = 0;
        let currentRotation = 0;

        // Custom fail-proof engine timer configuration to bypass watchOS runtime throttling
        function runFallbackTimer(callback) {
            return window.requestAnimationFrame(callback) || 
                   window.webkitRequestAnimationFrame(callback) || 
                   setTimeout(callback, 1000 / 30);
        }

        function setupTouchPedals() {
            const gas = document.getElementById('gas-zone');
            const brake = document.getElementById('brake-zone');

            gas.addEventListener('touchstart', (e) => { e.preventDefault(); currentTargetSpeed = 155; });
            gas.addEventListener('touchend', (e) => { e.preventDefault(); currentTargetSpeed = baseSpeed; });
            brake.addEventListener('touchstart', (e) => { e.preventDefault(); currentTargetSpeed = 15; });
            brake.addEventListener('touchend', (e) => { e.preventDefault(); currentTargetSpeed = baseSpeed; });
        }

        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            const clientX = e.touches ? e.touches.clientX : e.clientX;
            const clientY = e.touches ? e.touches.clientY : e.clientY;
            return Math.atan2(clientY - center.y, clientX - center.x);
        }

        wheel.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            startAngle = getAngle(e) - currentRotation;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const angle = getAngle(e);
            currentRotation = angle - startAngle;
            
            if (currentRotation > 1.3) currentRotation = 1.3;
            if (currentRotation < -1.3) currentRotation = -1.3;

            wheel.style.transform = `rotate(${currentRotation}rad)`;
            playerX = -currentRotation * 1.8;
        });

        window.addEventListener('touchend', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const snapBack = setInterval(() => {
                if (isDrawing) { clearInterval(snapBack); return; }
                currentRotation *= 0.75;
                playerX *= 0.75;
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                if (Math.abs(currentRotation) < 0.01) {
                    currentRotation = 0; playerX = 0;
                    wheel.style.transform = 'rotate(0rad)';
                    clearInterval(snapBack);
                }
            }, 30);
        });

        function update() {
            if (gameOver) return;

            speed += (currentTargetSpeed - speed) * 0.08;
            score += Math.floor(speed / 35);
            document.getElementById('score-val').textContent = score;
            document.getElementById('speed-val').textContent = Math.floor(speed);

            roadTracker += speed * 0.015;
            if (roadTracker >= 1) roadTracker = 0;

            curveTimer -= speed * 0.01;
            if (curveTimer <= 0) {
                curveTimer = Math.random() * 300 + 200;
                let randTrack = Math.random();
                if (randTrack < 0.35) targetCurvature = -0.7;
                else if (randTrack > 0.65) targetCurvature = 0.7;
                else targetCurvature = 0;
            }
            roadCurvature += (targetCurvature - roadCurvature) * 0.015;

            let centrifugalForce = roadCurvature * (speed / 70) * 0.012;
            let counterSteerDiff = playerX - (roadCurvature * 0.8);
            
            if (speed > 75 && Math.abs(playerX) > 0.6 && Math.abs(counterSteerDiff) > 0.8) {
                isDrifting = true;
                driftAngle += (playerX * 0.08 - driftAngle) * 0.15;
                screenShake = Math.max(screenShake, Math.abs(playerX) * 2.5);
                score += 5; 
            } else {
                isDrifting = false;
                driftAngle *= 0.82; 
            }

            let realSteerInput = playerX * 0.022;
            if (isDrifting) realSteerInput *= 0.65; 
            
            trackPosition += realSteerInput - centrifugalForce;

            if (Math.abs(trackPosition) > 0.82) {
                gameOver = true;
                alert(`OFF ROAD CRASH! Final Score: ${score}`);
                resetGame();
                return;
            }

            spawnTimer++;
            if (spawnTimer > Math.max(20, 50 - (speed / 4))) {
                spawnTimer = 0;
                obstacles.push({
                    progress: 0, 
                    lane: Math.floor(Math.random() * 3) - 1, 
                    color: `hsl(${Math.random() * 360}, 85%, 45%)`
                });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.progress += (speed * 0.0001) + (obs.progress * 0.035);

                if (obs.progress >= 1) {
