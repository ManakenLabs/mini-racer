<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DRIFT // Dashboard POV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: -apple-system, sans-serif;
            padding: 5px;
        }

        /* HUD Grid Display Overlay */
        #hud {
            display: flex;
            justify-content: space-between;
            width: 92%;
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
            z-index: 6;
            letter-spacing: 0.5px;
        }
        #score-val { color: #00f0ff; text-shadow: 0 0 6px #00f0ff; }
        #tilt-debug { color: #a1a1a6; font-size: 0.65rem; }

        /* Pseudo-3D Viewport Area */
        #view-wrapper {
            position: relative;
            width: 95vw;
            flex-grow: 1;
            max-height: 52vh;
            border: 2px solid #1e1e2e;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 14px rgba(0,240,255,0.25) inset;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* GAS / BRAKE touch zones, docked to left/right borders of the viewport */
        .pedal-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 16%;
            z-index: 7;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 0.6rem;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background 0.1s linear;
        }
        #brake-zone {
            left: 0;
            color: #ff3b5c;
            background: linear-gradient(to right, rgba(255,59,92,0.12), transparent);
        }
        #gas-zone {
            right: 0;
            color: #00f0ff;
            background: linear-gradient(to left, rgba(0,240,255,0.12), transparent);
        }
        .pedal-zone.active#brake-zone { background: linear-gradient(to right, rgba(255,59,92,0.4), transparent); }
        .pedal-zone.active#gas-zone { background: linear-gradient(to left, rgba(0,240,255,0.4), transparent); }

        /* Center Console Tier: analog speedometer pod */
        #console-tier {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 13vh;
            margin: 4px 0;
        }
        #speedo-pod {
            width: 110px;
            height: 78px;
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: radial-gradient(circle at 50% 0%, #10121c 0%, #05050a 80%);
            border: 1px solid #1e2230;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,240,255,0.2), inset 0 0 8px rgba(0,0,0,0.8);
        }
        #speedo-canvas { width: 100px; height: 68px; display: block; }

        /* Permission Calibration / Game Over Screens */
        #start-overlay, #gameover-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(4,2,10,0.94);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
        }
        #start-overlay p, #gameover-overlay p {
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0,240,255,0.7);
            letter-spacing: 1px;
        }
        #gameover-overlay { display: none; }
        #gameover-overlay .final-score {
            color: #ff2fd0;
            text-shadow: 0 0 10px rgba(255,47,208,0.8);
            font-size: 1.8rem;
            margin: 8px 0 16px;
        }
        .btn-start {
            background: linear-gradient(180deg, #00f0ff, #0090a8);
            color: #001014;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 0 12px rgba(0,240,255,0.6);
        }
        .btn-start:active { opacity: 0.7; }

        /* Physical Control Base Grid */
        #wheel-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 24vh;
            margin-bottom: 5px;
        }
        #steering-wheel {
            width: 85px;
            height: 85px;
            border: 9px solid #101018;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 30%, #1a1a22 70%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 0 12px rgba(0,240,255,0.35);
            touch-action: none;
            transition: transform 0.05s linear;
        }
        #steering-wheel::before {
            content: '';
            width: 20px;
            height: 20px;
            background: #12222a;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 8px rgba(0,240,255,0.8);
            border-radius: 50%;
            position: absolute;
            z-index: 2;
        }
        .spoke { position: absolute; background: #101018; box-shadow: 0 0 4px rgba(0,240,255,0.25); }
        .spoke-h { width: 67px; height: 8px; top: 38px; left: 0px; }
        .spoke-v { width: 8px; height: 34px; bottom: 0px; left: 38px; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <p>CALIBRATE DRIFT ENGAGEMENT</p>
        <button class="btn-start" onclick="initSensors()">LAUNCH</button>
    </div>

    <div id="gameover-overlay">
        <p>WIPEOUT</p>
        <div class="final-score" id="final-score-val">0</div>
        <button class="btn-start" onclick="restartGame()">RESTART</button>
    </div>

    <div id="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div id="tilt-debug">TILT: <span id="tilt-val">0°</span></div>
        <div style="visibility: hidden;"><span id="speed-val">0</span></div>
    </div>

    <div id="view-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div class="pedal-zone" id="brake-zone">BRAKE</div>
        <div class="pedal-zone" id="gas-zone">GAS</div>
    </div>

    <div id="console-tier">
        <div id="speedo-pod">
            <canvas id="speedo-canvas" width="100" height="68"></canvas>
        </div>
    </div>

    <div id="wheel-container">
        <div id="steering-wheel">
            <div class="spoke spoke-h"></div>
            <div class="spoke spoke-v"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const speedoCanvas = document.getElementById('speedo-canvas');
        const speedoCtx = speedoCanvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const scoreEl = document.getElementById('score-val');
        const tiltEl = document.getElementById('tilt-val');
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const finalScoreEl = document.getElementById('final-score-val');
        const gasZone = document.getElementById('gas-zone');
        const brakeZone = document.getElementById('brake-zone');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mechanical Settings Variables
        let playerX = 0;
        let score = 0;
        let speed = 20;
        let baseSpeed = 40;
        let currentTargetSpeed = 40;
        let gameOver = false;
        let roadTracker = 0;
        const MAX_SPEED = 160;

        // Curve & Drift Variables
        let roadCurvature = 0;
        let targetCurvature = 0;
        let curveTimer = 200;
        let driftAngle = 0;
        let isDrifting = false;
        let screenShake = 0;

        let obstacles = [];
        let spawnTimer = 120;

        // Hardware Controls Variables
        let isDrawing = false;
        let startAngle = 0;
        let currentRotation = 0;
        let basePitch = null;
        let currentPitch = 0;
        let sensorsActive = false;
        let touchGas = false;
        let touchBrake = false;

        const LANES = [-0.55, 0, 0.55];
        const ROAD_WIDTH_FRAC = 0.9;
        const VEHICLE_TYPES = ['coupe', 'truck'];

        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response == 'granted') {
                            window.addEventListener('deviceorientation', handleMotion);
                        }
                        beginGame();
                    })
                    .catch(() => beginGame());
            } else if (typeof DeviceOrientationEvent !== 'undefined') {
                window.addEventListener('deviceorientation', handleMotion);
                beginGame();
            } else {
                beginGame();
            }
        }

        function beginGame() {
            sensorsActive = true;
            startOverlay.style.display = 'none';
            requestAnimationFrame(loop);
        }

        function handleMotion(event) {
            let pitch = event.beta;
            if (pitch === null || pitch === undefined) return;
            if (basePitch === null) basePitch = pitch;
            currentPitch = pitch - basePitch;
            tiltEl.textContent = Math.floor(currentPitch) + '°';

            if (currentPitch > 6) {
                currentTargetSpeed = Math.min(MAX_SPEED, baseSpeed + (currentPitch - 6) * 5);
            } else if (currentPitch < -6) {
                currentTargetSpeed = Math.max(10, baseSpeed + (currentPitch + 6) * 4.5);
            } else {
                currentTargetSpeed = baseSpeed;
            }
        }

        // --- Keyboard fallback (desktop testing: Up/Down = gas/brake, Left/Right = steer) ---
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function handleKeyboardFallback() {
            if (keys['ArrowUp']) {
                currentTargetSpeed = Math.min(MAX_SPEED, baseSpeed + 60);
            } else if (keys['ArrowDown']) {
                currentTargetSpeed = Math.max(10, baseSpeed - 40);
            } else if (!sensorsActive || basePitch === null) {
                currentTargetSpeed = baseSpeed;
            }
            if (keys['ArrowLeft']) {
                currentRotation = Math.max(-1.3, currentRotation - 0.05);
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                playerX = -currentRotation / 1.3;
            } else if (keys['ArrowRight']) {
                currentRotation = Math.min(1.3, currentRotation + 0.05);
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                playerX = -currentRotation / 1.3;
            }
        }

        // --- GAS / BRAKE touch zones ---
        function bindPedal(el, onDown, onUp) {
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); el.classList.add('active'); }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); el.classList.remove('active'); }, { passive: false });
            el.addEventListener('mousedown', () => { onDown(); el.classList.add('active'); });
            el.addEventListener('mouseup', () => { onUp(); el.classList.remove('active'); });
            el.addEventListener('mouseleave', () => { onUp(); el.classList.remove('active'); });
        }
        bindPedal(gasZone, () => { touchGas = true; }, () => { touchGas = false; });
        bindPedal(brakeZone, () => { touchBrake = true; }, () => { touchBrake = false; });

        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - center.y, clientX - center.x);
        }

        function steerStart(e) {
            e.preventDefault();
            isDrawing = true;
            startAngle = getAngle(e) - currentRotation;
        }
        function steerMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const angle = getAngle(e);
            currentRotation = angle - startAngle;

            if (currentRotation > 1.3) currentRotation = 1.3;
            if (currentRotation < -1.3) currentRotation = -1.3;

            wheel.style.transform = `rotate(${currentRotation}rad)`;
            playerX = -currentRotation / 1.3;
        }
        function steerEnd() {
            isDrawing = false;
            const snapBack = setInterval(() => {
                if (isDrawing) { clearInterval(snapBack); return; }
                currentRotation *= 0.8;
                playerX *= 0.8;
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                if (Math.abs(currentRotation) < 0.01) {
                    currentRotation = 0; playerX = 0;
                    wheel.style.transform = 'rotate(0rad)';
                    clearInterval(snapBack);
                }
            }, 30);
        }

        wheel.addEventListener('touchstart', steerStart, { passive: false });
        window.addEventListener('touchmove', steerMove, { passive: false });
        window.addEventListener('touchend', steerEnd);
        wheel.addEventListener('mousedown', steerStart);
        window.addEventListener('mousemove', steerMove);
        window.addEventListener('mouseup', steerEnd);

        function resetState() {
            playerX = 0;
            score = 0;
            speed = 20;
            currentTargetSpeed = baseSpeed;
            gameOver = false;
            roadTracker = 0;
            roadCurvature = 0;
            targetCurvature = 0;
            curveTimer = 200;
            driftAngle = 0;
            isDrifting = false;
            screenShake = 0;
            obstacles = [];
            spawnTimer = 120;
            currentRotation = 0;
            touchGas = false;
            touchBrake = false;
            wheel.style.transform = 'rotate(0rad)';
            scoreEl.textContent = '0';
        }

        function restartGame() {
            resetState();
            gameoverOverlay.style.display = 'none';
        }

        function triggerCrash() {
            gameOver = true;
            screenShake = 24;
            finalScoreEl.textContent = score;
            setTimeout(() => { gameoverOverlay.style.display = 'flex'; }, 300);
        }

        // Perspective helpers: t = 0 at horizon, t = 1 at the bottom (near camera)
        function roadCenterX(t, w) {
            const curveOffset = roadCurvature * Math.pow(1 - t, 2) * w * 0.9;
            const steerOffset = -playerX * (w * ROAD_WIDTH_FRAC * 0.5) * t;
            return w / 2 + curveOffset + steerOffset;
        }
        function roadWidthAt(t, w) {
            return w * ROAD_WIDTH_FRAC * t;
        }

        function update() {
            if (gameOver) return;

            handleKeyboardFallback();
            if (touchGas) currentTargetSpeed = MAX_SPEED;
            else if (touchBrake) currentTargetSpeed = Math.max(8, baseSpeed - 50);

            speed += (currentTargetSpeed - speed) * 0.08;
            score += Math.floor(speed / 35);
            scoreEl.textContent = score;

            roadTracker += speed * 0.015;
            if (roadTracker >= 1) roadTracker -= 1;

            curveTimer -= speed * 0.05;
            if (curveTimer <= 0) {
                curveTimer = Math.random() * 300 + 200;
                let randTrack = Math.random();
                if (randTrack < 0.35) targetCurvature = -0.7;
                else if (randTrack > 0.65) targetCurvature = 0.7;
                else targetCurvature = 0;
            }
            roadCurvature += (targetCurvature - roadCurvature) * 0.02;

            driftAngle += (currentRotation - driftAngle) * 0.15;
            isDrifting = Math.abs(currentRotation - driftAngle) > 0.1 && speed > 90;
            if (isDrifting) score += 1;

            spawnTimer -= speed * 0.06;
            if (spawnTimer <= 0) {
                spawnTimer = Math.random() * 75 + 60;
                const lane = LANES[Math.floor(Math.random() * LANES.length)];
                const type = VEHICLE_TYPES[Math.floor(Math.random() * VEHICLE_TYPES.length)];
                const hue = Math.random() > 0.5 ? '#ff2fd0' : '#00f0ff';
                obstacles.push({ lane, z: 1, type, hue, passed: false });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.z -= speed * 0.0016;
                if (o.z <= 0.08 && o.z > -0.05 && !o.passed) {
                    const carLaneX = playerX * 0.55;
                    if (Math.abs(carLaneX - o.lane) < 0.34) {
                        o.passed = true;
                        triggerCrash();
                    }
                }
                if (o.z <= -0.05) {
                    obstacles.splice(i, 1);
                }
            }

            if (screenShake > 0) screenShake *= 0.9;
        }

        // ---------- MAIN VIEWPORT DRAWING ----------

        function drawSky(w, h) {
            const horizonY = h * 0.34;
            const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, '#0a0316');
            skyGrad.addColorStop(0.6, '#2b0f4a');
            skyGrad.addColorStop(1, '#ff2fd0');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, horizonY);

            // Glowing horizon sun
            ctx.save();
            ctx.shadowColor = '#ffdf6b';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ffdf6b';
            ctx.beginPath();
            ctx.arc(w / 2, horizonY - 2, w * 0.14, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // City skyline silhouette
            ctx.fillStyle = '#12042a';
            let bx = -20;
            let seed = 13;
            while (bx < w + 20) {
                seed = (seed * 9301 + 49297) % 233280;
                const bw = 10 + (seed % 22);
                seed = (seed * 9301 + 49297) % 233280;
                const bh = 8 + (seed % 40);
                ctx.fillRect(bx, horizonY - bh, bw, bh);
                bx += bw + 3;
            }

            // Distant synthwave grid lines fading into horizon
            ctx.strokeStyle = 'rgba(0,240,255,0.35)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 5; i++) {
                const y = horizonY - i * 6;
                if (y < 0) break;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
        }

        function drawRoad(w, h) {
            const horizonFrac = 0.34;
            const BANDS = 80;
            for (let i = 0; i < BANDS; i++) {
                const t0 = Math.pow(i / BANDS, 1.6);
                const t1 = Math.pow((i + 1) / BANDS, 1.6);
                const y0 = h * horizonFrac + t0 * h * (1 - horizonFrac);
                const y1 = h * horizonFrac + t1 * h * (1 - horizonFrac);
                const tMid = (t0 + t1) / 2;

                const groundShade = Math.floor((tMid * 12 + roadTracker * 12)) % 2 === 0 ? '#140a24' : '#1a0e2e';
                ctx.fillStyle = groundShade;
                ctx.fillRect(0, y0, w, (y1 - y0) + 1);

                const cx = roadCenterX(tMid, w);
                const rw = roadWidthAt(tMid, w);
                ctx.fillStyle = '#20202a';
                ctx.fillRect(cx - rw / 2, y0, rw, (y1 - y0) + 1);

                const rumbleShade = Math.floor((tMid * 16 + roadTracker * 16)) % 2 === 0 ? '#ff2fd0' : '#eeeeee';
                const edgeW = Math.max(2, rw * 0.04);
                ctx.fillStyle = rumbleShade;
                ctx.fillRect(cx - rw / 2, y0, edgeW, (y1 - y0) + 1);
                ctx.fillRect(cx + rw / 2 - edgeW, y0, edgeW, (y1 - y0) + 1);

                if (Math.floor((tMid * 20 + roadTracker * 20)) % 2 === 0) {
                    ctx.fillStyle = '#00f0ff';
                    const dashW = Math.max(1, rw * 0.018);
                    ctx.fillRect(cx - dashW / 2, y0, dashW, (y1 - y0) + 1);
                }
            }
        }

        function drawTaillights(x, y, spread, glowColor) {
            ctx.save();
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 8;
            ctx.fillStyle = glowColor;
            const r = Math.max(1, spread * 0.09);
            ctx.beginPath();
            ctx.arc(x - spread * 0.32, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + spread * 0.32, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawCoupe(x, y, size, hue) {
            ctx.save();
            ctx.fillStyle = '#0d0d14';
            ctx.strokeStyle = hue;
            ctx.lineWidth = Math.max(1, size * 0.02);
            ctx.shadowColor = hue;
            ctx.shadowBlur = size * 0.12;

            ctx.beginPath();
            ctx.moveTo(x - size * 0.5, y);
            ctx.lineTo(x - size * 0.42, y - size * 0.32);
            ctx.lineTo(x - size * 0.18, y - size * 0.46);
            ctx.lineTo(x + size * 0.18, y - size * 0.46);
            ctx.lineTo(x + size * 0.42, y - size * 0.32);
            ctx.lineTo(x + size * 0.5, y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            drawTaillights(x, y - size * 0.06, size, '#ff1f4a');
            ctx.restore();
        }

        function drawTruck(x, y, size, hue) {
            ctx.save();
            ctx.fillStyle = '#101018';
            ctx.strokeStyle = hue;
            ctx.lineWidth = Math.max(1, size * 0.02);
            ctx.shadowColor = hue;
            ctx.shadowBlur = size * 0.12;

            ctx.beginPath();
            ctx.rect(x - size * 0.46, y - size * 0.85, size * 0.92, size * 0.85);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = hue;
            ctx.globalAlpha = 0.25;
            ctx.fillRect(x - size * 0.4, y - size * 0.8, size * 0.8, size * 0.14);
            ctx.globalAlpha = 1;

            drawTaillights(x, y - size * 0.12, size * 1.05, '#ff1f4a');
            ctx.restore();
        }

        function drawObstacles(w, h) {
            const horizonFrac = 0.34;
            for (const o of obstacles) {
                if (o.z <= 0 || o.z > 1) continue;
                const t = 1 - o.z;
                const cx = roadCenterX(t, w);
                const rw = roadWidthAt(t, w);
                const yBase = h * horizonFrac + t * h * (1 - horizonFrac);
                const size = Math.max(3, w * (0.012 + 0.5 * Math.pow(t, 3)));
                const x = cx + o.lane * rw * 0.32;

                if (o.type === 'truck') {
                    drawTruck(x, yBase, size, o.hue);
                } else {
                    drawCoupe(x, yBase, size, o.hue);
                }
            }
        }

        // Cyberpunk cockpit / dashboard foreground overlay
        function drawCockpit(w, h) {
            const dashTop = h * 0.82;

            ctx.save();
            ctx.fillStyle = '#05050a';
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(0, h * 0.28);
            ctx.lineTo(w * 0.1, h * 0.4);
            ctx.lineTo(w * 0.06, h);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(w, h);
            ctx.lineTo(w, h * 0.28);
            ctx.lineTo(w * 0.9, h * 0.4);
            ctx.lineTo(w * 0.94, h);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(0,240,255,0.8)';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(w * 0.06, h);
            ctx.lineTo(w * 0.1, h * 0.4);
            ctx.moveTo(w * 0.94, h);
            ctx.lineTo(w * 0.9, h * 0.4);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            const dashGrad = ctx.createLinearGradient(0, dashTop, 0, h);
            dashGrad.addColorStop(0, '#0c0c14');
            dashGrad.addColorStop(1, '#020204');
            ctx.fillStyle = dashGrad;
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(0, dashTop + h * 0.02);
            ctx.quadraticCurveTo(w / 2, dashTop - h * 0.02, w, dashTop + h * 0.02);
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(0,240,255,0.9)';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(0, dashTop + h * 0.02);
            ctx.quadraticCurveTo(w / 2, dashTop - h * 0.02, w, dashTop + h * 0.02);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0,240,255,0.35)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 4;
            for (let i = 0; i < 4; i++) {
                const px = w * (0.16 + i * 0.24);
                ctx.beginPath();
                ctx.moveTo(px, dashTop + h * 0.05);
                ctx.lineTo(px, h);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#050508';
            ctx.strokeStyle = 'rgba(0,240,255,0.6)';
            ctx.lineWidth = 1.5;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 6;
            const mw = w * 0.18, mh = h * 0.05;
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(w / 2 - mw / 2, h * 0.16, mw, mh, 4);
            } else {
                ctx.rect(w / 2 - mw / 2, h * 0.16, mw, mh);
            }
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            const w = canvas.width, h = canvas.height;
            ctx.save();
            if (screenShake > 0.3) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            drawSky(w, h);
            drawRoad(w, h);
            drawObstacles(w, h);
            drawCockpit(w, h);

            if (gameOver) {
                ctx.fillStyle = 'rgba(20,0,10,0.4)';
                ctx.fillRect(0, 0, w, h);
            }
            ctx.restore();
        }

        // ---------- ANALOG SPEEDOMETER ----------

        function drawSpeedometer() {
            const w = speedoCanvas.width, h = speedoCanvas.height;
            speedoCtx.clearRect(0, 0, w, h);

            const cx = w / 2, cy = h - 4, r = h - 10;

            speedoCtx.save();
            speedoCtx.fillStyle = '#05050a';
            speedoCtx.beginPath();
            speedoCtx.arc(cx, cy, r + 4, Math.PI, Math.PI * 2);
            speedoCtx.fill();

            speedoCtx.strokeStyle = '#00f0ff';
            speedoCtx.lineWidth = 1.2;
            speedoCtx.shadowColor = '#00f0ff';
            speedoCtx.shadowBlur = 3;
            for (let v = 0; v <= MAX_SPEED; v += 20) {
                const angle = Math.PI - (v / MAX_SPEED) * Math.PI;
                const x1 = cx + Math.cos(angle) * (r - 6);
                const y1 = cy - Math.sin(angle) * (r - 6);
                const x2 = cx + Math.cos(angle) * r;
                const y2 = cy - Math.sin(angle) * r;
                speedoCtx.beginPath();
                speedoCtx.moveTo(x1, y1);
                speedoCtx.lineTo(x2, y2);
                speedoCtx.stroke();
            }
            speedoCtx.restore();

            const speedClamped = Math.max(0, Math.min(MAX_SPEED, speed));
            const needleAngle = Math.PI - (speedClamped / MAX_SPEED) * Math.PI;
            const nx = cx + Math.cos(needleAngle) * (r - 4);
            const ny = cy - Math.sin(needleAngle) * (r - 4);

            speedoCtx.save();
            speedoCtx.strokeStyle = '#ff1f3d';
            speedoCtx.shadowColor = '#ff1f3d';
            speedoCtx.shadowBlur = 8;
            speedoCtx.lineWidth = 2.2;
            speedoCtx.beginPath();
            speedoCtx.moveTo(cx, cy);
            speedoCtx.lineTo(nx, ny);
            speedoCtx.stroke();

            speedoCtx.fillStyle = '#ff1f3d';
            speedoCtx.beginPath();
            speedoCtx.arc(cx, cy, 3, 0, Math.PI * 2);
            speedoCtx.fill();
            speedoCtx.restore();

            speedoCtx.save();
            speedoCtx.fillStyle = '#00f0ff';
            speedoCtx.font = 'bold 10px -apple-system, sans-serif';
            speedoCtx.textAlign = 'center';
            speedoCtx.shadowColor = '#00f0ff';
            speedoCtx.shadowBlur = 4;
            speedoCtx.fillText(Math.round(speedClamped) + ' MPH', cx, cy - r * 0.32);
            speedoCtx.restore();
        }

        function loop() {
            update();
            draw();
            drawSpeedometer();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
