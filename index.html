<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIVIC DRIVE // WATCH POV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: -apple-system, sans-serif;
            padding: 2px;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 96%;
            color: #fff;
            font-size: 0.58rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            z-index: 6;
            margin-bottom: 2px;
        }
        #score-val { color: #00f0ff; }
        #gear-val { color: #ffdf6b; background: #221a00; padding: 0 4px; border-radius: 3px; }

        #view-wrapper {
            position: relative;
            width: 98vw;
            height: 42vh;
            border: 1px solid #222533;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        canvas { width: 100%; height: 100%; display: block; }

        #dash-cluster {
            width: 100%;
            height: 20vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090a10;
            border-top: 1px solid #1c1e29;
            margin: 2px 0;
        }
        #cluster-canvas { width: 150px; height: 36px; display: block; }

        #control-grid {
            width: 100%;
            height: 32vh;
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 3px;
            padding-bottom: 2px;
        }
        .watch-btn {
            border: none;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.6rem;
            color: #fff;
            background: #111424;
            border: 1px solid #1f253d;
        }
        .watch-btn:active {
            filter: brightness(1.4);
            transform: scale(0.96);
        }
        #brake-btn { background: linear-gradient(180deg, #420a11, #240206); border-color: #731520; color: #ff7383; }
        #gas-btn { background: linear-gradient(180deg, #07383b, #021a1c); border-color: #0d6e75; color: #52f3ff; }
        #action-btn { background: linear-gradient(180deg, #2b1136, #14041c); border-color: #5d2575; color: #e166ff; }

        #start-overlay, #gameover-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 10px;
        }
        #start-overlay p, #gameover-overlay p { font-size: 0.9rem; color: #00f0ff; font-weight: bold; }
        .sub { color: #a1a1a6; font-size: 0.52rem; margin: 4px 0; line-height: 1.3; }
        .btn-start {
            background: #00f0ff; color: #000; border: none; padding: 6px 14px;
            border-radius: 4px; font-size: 0.65rem; font-weight: bold; margin-top: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <p>CIVIC COCKPIT</p>
        <div class="sub">COMPACT WRIST LAYOUT<br>GAS/BRAKE ADJUSTS RPM<br>TAP ACT TO BLAST TRAFFIC</div>
        <button class="btn-start" onclick="startGameEngine()">DRIVE</button>
    </div>

    <div id="gameover-overlay" style="display:none;">
        <p>CRASH</p>
        <div class="sub" id="final-score">SCORE: 0</div>
        <button class="btn-start" onclick="restartGame()">RETRY</button>
    </div>

    <div id="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div>GEAR: <span id="gear-val">1</span></div>
        <div>STR: <span id="tilt-val">0&deg;</span></div>
    </div>

    <div id="view-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="dash-cluster">
        <canvas id="cluster-canvas"></canvas>
    </div>

    <div id="control-grid">
        <button id="brake-btn" class="watch-btn">BRK</button>
        <button id="gas-btn" class="watch-btn">GAS</button>
        <button id="action-btn" class="watch-btn">ACT</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const clusterCanvas = document.getElementById('cluster-canvas');
        const cctx = clusterCanvas.getContext('2d');

        let running = false;
        let score = 0;
        let playerX = 0;
        let position = 0;
        let roadSegments = [];
        const segmentLength = 15;
        const totalSegments = 100;

        let speed = 0; 
        let rpm = 800; 
        let gear = 1;
        const maxRpm = 6800;
        const redline = 6200;
        
        // Fixed gear ratios configuration object
        const gearRatios = { 1: 45, 2: 75, 3: 115, 4: 160, 5: 210 }; 

        let gasPressed = false;
        let brakePressed = false;
        let steeringAngle = 0;

        let entities = [];
        let lasers = [];

        function resize() {
            const r1 = canvas.parentElement.getBoundingClientRect();
            canvas.width = r1.width * window.devicePixelRatio;
            canvas.height = r1.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const r2 = clusterCanvas.parentElement.getBoundingClientRect();
            clusterCanvas.width = 150 * window.devicePixelRatio;
            clusterCanvas.height = 36 * window.devicePixelRatio;
            cctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < totalSegments; i++) {
            roadSegments.push({
                curve: Math.sin(i / 8) * 1.2,
                color: (Math.floor(i / 4) % 2 === 0) ? '#080912' : '#101222'
            });
        }

        function startGameEngine() {
            document.getElementById('start-overlay').style.display = 'none';
            
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleTilt);
                            }
                        }).catch(err => console.log("Sensor fallback active: ", err));
                } else {
                    window.addEventListener('deviceorientation', handleTilt);
                }
            }
            restartGame();
        }

        function handleTilt(e) {
            let tilt = e.gamma || 0;
            if (tilt > 25) tilt = 25;
            if (tilt < -25) tilt = -25;
            steeringAngle = tilt;
        }

        // Support desktop arrows if device orientation flags are missing
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') steeringAngle = -20;
            if (e.key === 'ArrowRight') steeringAngle = 20;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') steeringAngle = 0;
        });

        const bind = (el, pressFn, releaseFn) => {
            el.addEventListener('touchstart', (e) => { e.preventDefault(); pressFn(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); releaseFn(); });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); pressFn(); });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); releaseFn(); });
            el.addEventListener('mouseleave', (e) => { if (gasPressed || brakePressed) releaseFn(); });
        };

        bind(document.getElementById('gas-btn'), () => gasPressed = true, () => gasPressed = false);
        bind(document.getElementById('brake-btn'), () => brakePressed = true, () => brakePressed = false);
        
        document.getElementById('action-btn').addEventListener('touchstart', (e) => { e.preventDefault(); fireLaser(); });
        document.getElementById('action-btn').addEventListener('mousedown', (e) => { e.preventDefault(); fireLaser(); });

        function fireLaser() {
            if (speed > 2) lasers.push({ x: playerX * 0.4, z: 20 });
        }

        function restartGame() {
            score = 0; speed = 0; rpm = 800; gear = 1; playerX = 0; steeringAngle = 0;
            entities = []; lasers = []; running = true;
            document.getElementById('gameover-overlay').style.display = 'none';
        }

        function triggerCrash() {
            running = false;
            document.getElementById('final-score').innerText = `SCORE: ${Math.floor(score)}`;
            document.getElementById('gameover-overlay').style.display = 'flex';
        }

        function updateSimulation() {
            if (!running) return;

            let maxSpeedForGear = gearRatios[gear];
            let minSpeedForGear = gear > 1 ? gearRatios[gear - 1] - 5 : 0;

            if (gasPressed) {
