<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Drift Racer POV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: -apple-system, sans-serif;
            padding: 5px;
        }
        /* HUD Grid Display Overlay */
        #hud {
            display: flex;
            justify-content: space-between;
            width: 90%;
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
            z-index: 5;
        }
        #score-val { color: #34c759; }
        #tilt-debug { color: #a1a1a6; font-size: 0.7rem; }

        /* Pseudo-3D Viewport Area */
        #view-wrapper {
            position: relative;
            width: 95vw;
            flex-grow: 1;
            max-height: 55vh;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Permission Calibration Screen */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
        }
        .btn-start {
            background: #34c759;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
        }

        /* Physical Control Base Grid */
        #wheel-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 28vh;
            margin-bottom: 5px;
        }
        #steering-wheel {
            width: 85px;
            height: 85px;
            border: 9px solid #2d2d30;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 30%, #222 70%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 4px 6px rgba(0,0,0,0.5);
            touch-action: none;
            transition: transform 0.05s linear;
        }
        #steering-wheel::before {
            content: '';
            width: 20px;
            height: 20px;
            background: #444;
            border: 2px solid #555;
            border-radius: 50%;
            position: absolute;
            z-index: 2;
        }
        .spoke { position: absolute; background: #2d2d30; }
        .spoke-h { width: 67px; height: 8px; top: 38px; left: 0px; }
        .spoke-v { width: 8px; height: 34px; bottom: 0px; left: 38px; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <p>CALIBRATE DRIFT ENGAGEMENT</p>
        <button class="btn-start" onclick="initSensors()">LAUNCH</button>
    </div>

    <div id="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div id="tilt-debug">TILT: <span id="tilt-val">0°</span></div>
        <div style="visibility: hidden;"><span id="speed-val">0</span></div>
    </div>

    <div id="view-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="wheel-container">
        <div id="steering-wheel">
            <div class="spoke spoke-h"></div>
            <div class="spoke spoke-v"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mechanical Settings Variables
        let playerX = 0; 
        let score = 0;
        let speed = 20; 
        let baseSpeed = 40;
        let currentTargetSpeed = 40;
        let gameOver = false;
        let roadTracker = 0;

        // Curve & Drift Variables
        let roadCurvature = 0;      // Current local segment curve
        let targetCurvature = 0;    // Target horizon curve direction
        let curveTimer = 0;
        let trackPosition = 0;      // Accumulator tracking where car is on the road width-wise
        let driftAngle = 0;         // Tracks visual tire slide angle offset
        let isDrifting = false;
        let screenShake = 0;

        let obstacles = [];
        let spawnTimer = 0;

        // Hardware Controls Variables
        let isDrawing = false;
        let startAngle = 0;
        let currentRotation = 0;
        let basePitch = null; 
        let currentPitch = 0;

        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response == 'granted') {
                            window.addEventListener('deviceorientation', handleMotion);
                            document.getElementById('start-overlay').style.display = 'none';
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleMotion);
                document.getElementById('start-overlay').style.display = 'none';
            }
        }

        function handleMotion(event) {
            let pitch = event.beta; 
            if (basePitch === null && pitch !== null) basePitch = pitch; 
            currentPitch = pitch - basePitch;
            document.getElementById('tilt-val').textContent = Math.floor(currentPitch) + '°';

            if (currentPitch > 6) { 
                currentTargetSpeed = Math.min(160, baseSpeed + (currentPitch - 6) * 5);
            } else if (currentPitch < -6) { 
                currentTargetSpeed = Math.max(10, baseSpeed + (currentPitch + 6) * 4.5);
            } else {
                currentTargetSpeed = baseSpeed;
            }
        }

        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            const clientX = e.touches ? e.touches.clientX : e.clientX;
            const clientY = e.touches ? e.touches.clientY : e.clientY;
            return Math.atan2(clientY - center.y, clientX - center.x);
        }

        wheel.addEventListener('touchstart', (e) => {
            isDrawing = true;
            startAngle = getAngle(e) - currentRotation;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const angle = getAngle(e);
            currentRotation = angle - startAngle;
            
            if (currentRotation > 1.3) currentRotation = 1.3;
            if (currentRotation < -1.3) currentRotation = -1.3;

            wheel.style.transform = `rotate(${currentRotation}rad)`;
            playerX = -currentRotation * 1.8;
        });

        window.addEventListener('touchend', () => {
            isDrawing = false;
            const snapBack = setInterval(() => {
                if (isDrawing) { clearInterval(snapBack); return; }
                currentRotation *= 0.75;
                playerX *= 0.75;
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                if (Math.abs(currentRotation) < 0.01) {
                    currentRotation = 0; playerX = 0;
                    wheel.style.transform = 'rotate(0rad)';
                    clearInterval(snapBack);
                }
            }, 30);
        });

        function update() {
            if (gameOver) return;

            speed += (currentTargetSpeed - speed) * 0.08;
            score += Math.floor(speed / 35);
            document.getElementById('score-val').textContent = score;

            roadTracker += speed * 0.015;
            if (roadTracker >= 1) roadTracker = 0;

            // Handle Dynamic Road Curvature Generation Loops
            curveTimer -= speed * 0.01;
            if (curveTimer <= 0) {
                curveTimer = Math.random() * 300 + 200;
                // Alternate between left curves (-0.8), right curves (0.8), or straight paths (0)
                let randTrack = Math.random();
                if (randTrack < 0.35) targetCurvature = -0.7;
                else if (randTrack > 0.65) targetCurvature = 0.7;
                else targetCurvature = 0;
            }
            // Interpolate road curvature smoothly over time matching current velocity indices
            roadCurvature += (targetCurvature - roadCurvature) * 0.015;

            // Calculate centrifugal force acting on the car position structure
            let centrifugalForce = roadCurvature * (speed / 70) * 0.012;
