<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Icy Tower HTML5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            background: #222;
            border: 4px solid #333;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #1c1714;
        }
        .controls {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #222;
        }
        .btn {
            background: #ff5500;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            min-width: 120px;
            text-align: center;
        }
        .btn-green {
            background: #00aa66;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="500"></canvas>
</div>

<div class="controls">
    <button id="leftBtn" class="btn">← LEFT</button>
    <button id="jumpBtn" class="btn btn-green">JUMP</button>
    <button id="rightBtn" class="btn">RIGHT →</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let highestFloor = 0;
let cameraY = 0;
let gameOver = false;

let player = {
    x: 180,
    y: 400,
    width: 30,
    height: 35,
    vx: 0,
    vy: 0,
    speed: 0.5,
    maxVx: 6,
    gravity: 0.4,
    jumpForce: -9.5,
    isGrounded: false
};

let platforms = [];

// Clean Event Listeners for On-Screen Buttons (Works everywhere on Mobile & Desktop)
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const jumpBtn = document.getElementById('jumpBtn');

let moveLeft = false;
let moveRight = false;

// Left Button Touch/Mouse
leftBtn.addEventListener('mousedown', () => moveLeft = true);
leftBtn.addEventListener('mouseup', () => moveLeft = false);
leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
leftBtn.addEventListener('touchend', () => moveLeft = false);

// Right Button Touch/Mouse
rightBtn.addEventListener('mousedown', () => moveRight = true);
rightBtn.addEventListener('mouseup', () => moveRight = false);
rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
rightBtn.addEventListener('touchend', () => moveRight = false);

// Jump Button Touch/Mouse
const triggerJump = () => {
    if (player.isGrounded) {
        player.vy = player.jumpForce;
        player.isGrounded = false;
    }
    if (gameOver) resetGame();
};
jumpBtn.addEventListener('mousedown', triggerJump);
jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); });

// Keyboard Fallback Controls
window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft') moveLeft = true;
    if (e.code === 'ArrowRight') moveRight = true;
    if (e.code === 'Space' || e.code === 'ArrowUp') triggerJump();
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft') moveLeft = false;
    if (e.code === 'ArrowRight') moveRight = false;
});

function resetGame() {
    score = 0;
    highestFloor = 0;
    cameraY = 0;
    gameOver = false;
    player.x = 180;
    player.y = 400;
    player.vx = 0;
    player.vy = 0;
    
    platforms = [];
    platforms.push({ x: 0, y: 470, width: canvas.width, label: 0 }); // Ground base floor
    for (let i = 1; i < 50; i++) {
        let w = Math.max(90, 200 - (i * 1.5));
        let x = Math.random() * (canvas.width - w - 20) + 10;
        let y = 470 - (i * 80);
        platforms.push({ x: x, y: y, width: w, label: i });
    }
}

function update() {
    if (gameOver) return;

    // Movement Calculations
    if (moveLeft) player.vx -= player.speed;
    else if (moveRight) player.vx += player.speed;
    else player.vx *= 0.85;

    if (player.vx > player.maxVx) player.vx = player.maxVx;
    if (player.vx < -player.maxVx) player.vx = -player.maxVx;

    player.x += player.vx;

    // Wall Bounce mechanics
    if (player.x < 0) { player.x = 0; player.vx = -player.vx * 1.1; }
    if (player.x > canvas.width - player.width) { player.x = canvas.width - player.width; player.vx = -player.vx * 1.1; }

    // Gravity
    player.vy += player.gravity;
    player.y += player.vy;
    player.isGrounded = false;

    // Landing check
    if (player.vy > 0) {
        platforms.forEach(p => {
            if (
                player.x + player.width > p.x &&
                player.x < p.x + p.width &&
                player.y + player.height >= p.y &&
                player.y + player.height - player.vy <= p.y + 12
            ) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.isGrounded = true;

                if (p.label > highestFloor) {
                    highestFloor = p.label;
                    score = highestFloor * 10;
                }
            }
        });
    }

    // Camera follow mechanics
    if (player.y - cameraY < 200) {
        cameraY += ((player.y - cameraY) - 200) * 0.1;
    }
    
    // Smooth camera crawl
    cameraY -= 0.4 + (highestFloor * 0.02);

    // Out of bounds check
    if (player.y - cameraY > canvas.height) {
        gameOver = true;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background bricks grid lines
    ctx.strokeStyle = '#28211d';
    ctx.lineWidth = 1;
    for (let y = Math.floor(cameraY % 40); y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Platforms
    platforms.forEach(p => {
        let ry = p.y - cameraY;
        if (ry < -50 || ry > canvas.height + 50) return;
        
        ctx.fillStyle = '#5c8ba6';
        ctx.fillRect(p.x, ry, p.width, 24); // Thick ice floor structures
        ctx.fillStyle = '#d9f0fc';
        ctx.fillRect(p.x, ry, p.width, 6);

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.font = 'bold 11px Arial';
        ctx.fillText(`FL ${p.label}`, p.x + 8, ry + 18);
    });

    // Drawing Kenny character capsule representation shapes
    let ry = player.y - cameraY;
    if (!gameOver) {
        ctx.fillStyle = '#e65c00'; // Orange coat body base layer
        ctx.fillRect(player.x, ry, player.width, player.height);
        ctx.fillStyle = '#ffdbbd'; // Face layout opening bubble
        ctx.fillRect(player.x + 6, ry + 4, player.width - 12, 14);
        ctx.fillStyle = '#fff'; // White eyes circles
        ctx.fillRect(player.x + 9, ry + 7, 5, 7);
        ctx.fillRect(player.x + 16, ry + 7, 5, 7);
    }

    // Scores Overlay displays
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`SCORE: ${score}`, 15, 25);
    ctx.fillText(`FLOOR: ${highestFloor}`, canvas.width - 110, 25);

    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff3300';
        ctx.font = 'bold 24px monospace';
        ctx.fillText("GAME OVER", canvas.width/2 - 65, canvas.height/2);
        ctx.fillStyle = '#fff';
        ctx.font = '14px monospace';
        ctx.fillText("TAP JUMP TO RESTART", canvas.width/2 - 80, canvas.height/2 + 30);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

resetGame();
gameLoop();
</script>

</body>
</html>
