<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Drift Racer POV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: -apple-system, sans-serif;
            padding: 5px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 90%;
            color: #fff;
            font-size: 0.85rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
            z-index: 5;
        }
        #score-val { color: #34c759; }
        #control-mode { color: #a1a1a6; font-size: 0.7rem; }

        #view-wrapper {
            position: relative;
            width: 95vw;
            flex-grow: 1;
            max-height: 55vh;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
        }
        .btn-start {
            background: #34c759;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
        }

        #wheel-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 28vh;
            margin-bottom: 5px;
            position: relative;
        }
        #steering-wheel {
            width: 85px;
            height: 85px;
            border: 9px solid #2d2d30;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 30%, #222 70%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 4px 6px rgba(0,0,0,0.5);
            touch-action: none;
            transition: transform 0.05s linear;
            z-index: 2;
        }
        #steering-wheel::before {
            content: '';
            width: 20px;
            height: 20px;
            background: #444;
            border: 2px solid #555;
            border-radius: 50%;
            position: absolute;
            z-index: 3;
        }
        .spoke { position: absolute; background: #2d2d30; }
        .spoke-h { width: 67px; height: 8px; top: 38px; left: 0px; }
        .spoke-v { width: 8px; height: 34px; bottom: 0px; left: 38px; }

        /* Fallback Touch Zones for Throttle/Brake */
        .touch-pedal {
            position: absolute;
            bottom: 0;
            width: 70px;
            height: 100%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.2);
            font-size: 0.6rem;
            font-weight: bold;
            border-radius: 8px;
        }
        #brake-zone { left: 5px; background: rgba(255, 59, 48, 0.05); }
        #gas-zone { right: 5px; background: rgba(52, 199, 89, 0.05); }
    </style>
</head>
<body>

    <div id="start-overlay">
        <p>READY TO DRIVE</p>
        <button class="btn-start" onclick="startGameCanvas()">LAUNCH</button>
    </div>

    <div id="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div id="control-mode">MODE: TOUCH</div>
        <div><span id="speed-val">0</span> MPH</div>
    </div>

    <div id="view-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="wheel-container">
        <div id="brake-zone" class="touch-pedal">BRAKE</div>
        <div id="steering-wheel">
            <div class="spoke spoke-h"></div>
            <div class="spoke spoke-v"></div>
        </div>
        <div id="gas-zone" class="touch-pedal">GAS</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let playerX = 0; 
        let score = 0;
        let speed = 20; 
        let baseSpeed = 40;
        let currentTargetSpeed = 40;
        let gameOver = false;
        let roadTracker = 0;

        let roadCurvature = 0;      
        let targetCurvature = 0;    
        let curveTimer = 0;
        let trackPosition = 0;      
        let driftAngle = 0;         
        let isDrifting = false;
        let screenShake = 0;

        let obstacles = [];
        let spawnTimer = 0;

        let isDrawing = false;
        let startAngle = 0;
        let currentRotation = 0;

        // Directly opens the game loop and bypasses permission stalls
        function startGameCanvas() {
            document.getElementById('start-overlay').style.display = 'none';
            setupTouchPedals();
            
            // Try enabling gyroscope fallback if browser allows it natively
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if(res === 'granted') {
                        window.addEventListener('deviceorientation', (e) => {
                            let pitch = e.beta;
                            if (pitch > 45) currentTargetSpeed = Math.min(160, baseSpeed + (pitch - 45) * 3);
                            if (pitch < 30) currentTargetSpeed = Math.max(10, baseSpeed - (30 - pitch) * 3);
                            document.getElementById('control-mode').textContent = "MODE: TILT";
                        });
                    }
                }).catch(() => {});
            }
        }

        function setupTouchPedals() {
            const gas = document.getElementById('gas-zone');
            const brake = document.getElementById('brake-zone');

            gas.addEventListener('touchstart', () => { currentTargetSpeed = 150; });
            gas.addEventListener('touchend', () => { currentTargetSpeed = baseSpeed; });
            brake.addEventListener('touchstart', () => { currentTargetSpeed = 15; });
            brake.addEventListener('touchend', () => { currentTargetSpeed = baseSpeed; });
        }

        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            const clientX = e.touches ? e.touches.clientX : e.clientX;
            const clientY = e.touches ? e.touches.clientY : e.clientY;
            return Math.atan2(clientY - center.y, clientX - center.x);
        }

        wheel.addEventListener('touchstart', (e) => {
            isDrawing = true;
            startAngle = getAngle(e) - currentRotation;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const angle = getAngle(e);
            currentRotation = angle - startAngle;
            
            if (currentRotation > 1.3) currentRotation = 1.3;
            if (currentRotation < -1.3) currentRotation = -1.3;

            wheel.style.transform = `rotate(${currentRotation}rad)`;
            playerX = -currentRotation * 1.8;
        });

        window.addEventListener('touchend', () => {
            isDrawing = false;
            const snapBack = setInterval(() => {
                if (isDrawing) { clearInterval(snapBack); return; }
                currentRotation *= 0.75;
                playerX *= 0.75;
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                if (Math.abs(currentRotation) < 0.01) {
                    currentRotation = 0; playerX = 0;
                    wheel.style.transform = 'rotate(0rad)';
                    clearInterval(snapBack);
                }
            }, 30);
        });

        function update() {
            if (gameOver) return;

            speed += (currentTargetSpeed - speed) * 0.08;
            score += Math.floor(speed / 35);
            document.getElementById('score-val').textContent = score;
            document.getElementById('speed-val').textContent = Math.floor(speed);

            roadTracker += speed * 0.015;
            if (roadTracker >= 1) roadTracker = 0;

            curveTimer -= speed * 0.01;
            if (curveTimer <= 0) {
                curveTimer = Math.random() * 300 + 200;
                let randTrack = Math.random();
                if (randTrack < 0.35) targetCurvature = -0.7;
                else if (randTrack > 0.65) targetCurvature = 0.7;
                else targetCurvature = 0;
            }
            roadCurvature += (targetCurvature - roadCurvature) * 0.015;
