<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Icy Tower HTML5 - Kenny Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            background: #222;
            border: 4px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 2px 2px 0px #000;
            z-index: 5;
        }
        #combo-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ff5500;
            padding: 5px;
            border-radius: 5px;
            display: none;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #combo-bar {
            height: 8px;
            background: #ff5500;
            width: 100%;
        }
        #combo-text {
            font-size: 13px;
            margin-bottom: 2px;
            color: #ffaa00;
            text-shadow: 1px 1px 0 #000;
        }
        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .menu-btn {
            background: #ff5500;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin: 10px;
            box-shadow: 0 4px 0 #992200;
            width: 85%;
            max-width: 280px;
        }
        .menu-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #992200;
        }
        .controls-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: #222;
            border: 4px solid #444;
            border-top: none;
        }
        .game-btn {
            background: #ff5500;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 4px 0 #992200;
        }
        .game-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #992200;
        }
        .btn-green { background: #00aa66; box-shadow: 0 4px 0 #005522; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div class="ui-overlay">
        <div id="score-display">SCORE: 0</div>
        <div id="floor-display">FLOOR: 0</div>
    </div>

    <div id="combo-container">
        <div id="combo-text">COMBO X2</div>
        <div id="combo-bar"></div>
    </div>

    <div id="menu-overlay">
        <h1 style="color: #ff5500; margin-bottom: 5px; text-shadow: 2px 2px 0 #000; font-size: 32px;">ICY TOWER</h1>
        <p style="margin-bottom: 25px; font-size: 14px; color: #ccc;">Kenny Edition</p>
        
        <button id="play-buttons-btn" class="menu-btn">PLAY WITH BUTTONS / KEYS</button>
        <button id="play-tilt-btn" class="menu-btn" style="background: #00aa66; box-shadow: 0 4px 0 #005522;">PLAY ON IPHONE (TILT)</button>
        
        <p style="font-size: 11px; margin-top: 20px; color: #aaa; line-height: 1.4; max-width: 85%;">
            Click a button to start climbing!
        </p>
    </div>
</div>

<div class="controls-bar" id="onScreenButtons">
    <button id="leftBtn" class="game-btn">← LEFT</button>
    <button id="jumpBtn" class="game-btn btn-green">JUMP</button>
    <button id="rightBtn" class="game-btn">RIGHT →</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Parameters
let gameState = 'MENU';
let score = 0;
let highestFloor = 0;
let cameraY = 0;
let baseScrollSpeed = 0.35;

// Entities
let player = {
    x: 180, y: 400,
    width: 32, height: 40,
    vx: 0, vy: 0,
    speed: 0.45, maxVx: 7.5,
    friction: 0.88, gravity: 0.42,
    jumpForce: -9.5,
    isGrounded: false, facing: 1
};

let platforms = [];
const PLATFORM_THICKNESS = 32;

// Combo & Spark Particle System
let comboActive = false;
let comboCount = 0;
let comboClock = 0;
const MAX_COMBO_CLOCK = 100;
let lastFloorLanded = 0;
let particles = [];

// Control states
let useGyro = false;
let tiltAngle = 0;
let moveLeft = false;
let moveRight = false;

// UI Handles
const menuOverlay = document.getElementById('menu-overlay');
const scoreDisplay = document.getElementById('score-display');
const floorDisplay = document.getElementById('floor-display');
const comboContainer = document.getElementById('combo-container');
const comboBar = document.getElementById('combo-bar');
const comboText = document.getElementById('combo-text');
const onScreenButtons = document.getElementById('onScreenButtons');

// Core Launch Hook (Safe from local file permission blockers)
function initGame(gyroRequested) {
    if (gyroRequested) {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        useGyro = true;
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        onScreenButtons.style.display = 'none';
                        launch();
                    } else {
                        alert("Tilt access denied. Using button controls.");
                        useGyro = false;
                        launch();
                    }
                }).catch(() => {
                    // Safe local execution bypass
                    useGyro = false;
                    launch();
                });
            return;
        } else {
            useGyro = true;
            window.addEventListener('deviceorientation', handleOrientation, true);
            onScreenButtons.style.display = 'none';
        }
    } else {
        useGyro = false;
        onScreenButtons.style.display = 'flex';
    }
    launch();
}

// Bind cleanly using standard cross-platform click maps
document.getElementById('play-buttons-btn').addEventListener('click', () => initGame(false));
document.getElementById('play-tilt-btn').addEventListener('click', () => initGame(true));

// Gamepad UI Elements Event Links
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const jumpBtn = document.getElementById('jumpBtn');

leftBtn.addEventListener('mousedown', () => moveLeft = true);
leftBtn.addEventListener('mouseup', () => moveLeft = false);
leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
leftBtn.addEventListener('touchend', () => moveLeft = false);

rightBtn.addEventListener('mousedown', () => moveRight = true);
rightBtn.addEventListener('mouseup', () => moveRight = false);
rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
rightBtn.addEventListener('touchend', () => moveRight = false);

const performJump = () => {
    if (player.isGrounded && !useGyro) {
        let sprintBonus = Math.abs(player.vx) * 0.45;
        player.vy = player.jumpForce - sprintBonus;
        player.isGrounded = false;
    }
    if (gameState === 'GAME_OVER') {
        launch();
    }
};
jumpBtn.addEventListener('mousedown', performJump);
jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); performJump(); });

// Keyboard Handlers
window.addEventListener('keydown', e => { 
    if(e.code === 'ArrowLeft') moveLeft = true;
    if(e.code === 'ArrowRight') moveRight = true;
    if(e.code === 'Space' || e.code === 'ArrowUp') performJump();
});
window.addEventListener('keyup', e => { 
    if(e.code === 'ArrowLeft') moveLeft = false;
    if(e.code === 'ArrowRight') moveRight = false;
});

function handleOrientation(event) {
    if (event.gamma !== null) tiltAngle = event.gamma;
}

function launch() {
    gameState = 'PLAYING';
    menuOverlay.style.display = 'none';
    score = 0;
    highestFloor = 0;
    cameraY = 0;
    baseScrollSpeed = 0.35;
    player.x = 180;
    player.y = 400;
    player.vx = 0;
    player.vy = 0;
    lastFloorLanded = 0;
    comboActive = false;
    comboCount = 0;
    particles = [];

    platforms = [];
