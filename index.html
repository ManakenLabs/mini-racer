<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DRIFT // Dashboard POV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: -apple-system, sans-serif;
            padding: 4px;
        }

        /* HUD Grid Display Overlay */
        #hud {
            display: flex;
            justify-content: space-between;
            width: 94%;
            color: #fff;
            font-size: 0.7rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            z-index: 6;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        #score-val { color: #00f0ff; text-shadow: 0 0 6px #00f0ff; }
        #tilt-debug { color: #a1a1a6; font-size: 0.6rem; }
        #combo-val { color: #ff2fd0; text-shadow: 0 0 6px #ff2fd0; }

        /* Pseudo-3D Viewport Area */
        #view-wrapper {
            position: relative;
            width: 96vw;
            flex-grow: 1;
            max-height: 63vh;
            border: 2px solid #1e1e2e;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 14px rgba(0,240,255,0.25) inset;
            margin: 3px 0;
        }
        canvas { width: 100%; height: 100%; display: block; }

        #jump-flash {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            color: #ffdf6b;
            font-weight: 900;
            font-size: 1.1rem;
            text-shadow: 0 0 10px #ffdf6b;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        #jump-flash.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Console tier: speedo + tilt gauge side by side */
        #console-tier {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 11vh;
            flex-shrink: 0;
        }
        #speedo-pod, #wheel-pod {
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 0%, #10121c 0%, #05050a 80%);
            border: 1px solid #1e2230;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,240,255,0.2), inset 0 0 8px rgba(0,0,0,0.8);
        }
        #speedo-pod { flex: 1.4; align-items: flex-start; }
        #speedo-canvas { width: 100px; height: 68px; display: block; }
        #wheel-pod { flex: 1; }

        #steering-wheel {
            width: 52px;
            height: 52px;
            border: 6px solid #101018;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 30%, #1a1a22 70%);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 0 10px rgba(0,240,255,0.35);
            touch-action: none;
            transition: transform 0.05s linear;
        }
        #steering-wheel::before {
            content: '';
            width: 12px; height: 12px;
            background: #12222a;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 6px rgba(0,240,255,0.8);
            border-radius: 50%;
            position: absolute;
            z-index: 2;
        }
        .spoke { position: absolute; background: #101018; }
        .spoke-h { width: 40px; height: 5px; top: 23.5px; left: 0px; }
        .spoke-v { width: 5px; height: 20px; bottom: 0px; left: 23.5px; }

        /* Control bar: JUMP / GAS / BLASTER */
        #control-bar {
            width: 100%;
            display: flex;
            gap: 6px;
            height: 17vh;
            flex-shrink: 0;
        }
        .ctrl-btn {
            flex: 1;
            border: none;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            letter-spacing: 0.5px;
            font-size: 0.72rem;
            color: #001014;
            transition: transform 0.08s ease, filter 0.08s ease;
        }
        .ctrl-btn .icon { font-size: 1.3rem; line-height: 1; margin-bottom: 2px; }
        .ctrl-btn.active, .ctrl-btn.active-jump, .ctrl-btn.firing {
            transform: scale(0.92);
            filter: brightness(1.3);
        }
        #jump-btn {
            background: linear-gradient(180deg, #ffdf6b, #c99a1f);
            box-shadow: 0 0 12px rgba(255,223,107,0.5);
        }
        #gas-btn {
            flex: 1.3;
            background: linear-gradient(180deg, #00f0ff, #0090a8);
            box-shadow: 0 0 14px rgba(0,240,255,0.6);
        }
        #blaster-btn {
            background: linear-gradient(180deg, #ff2fd0, #a3008a);
            box-shadow: 0 0 12px rgba(255,47,208,0.5);
            color: #1a0016;
        }

        /* Permission Calibration / Game Over Screens */
        #start-overlay, #gameover-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(4,2,10,0.94);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
        }
        #start-overlay p, #gameover-overlay p {
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0,240,255,0.7);
            letter-spacing: 1px;
        }
        #start-overlay .sub {
            color: #a1a1a6;
            font-size: 0.6rem;
            font-weight: normal;
            text-shadow: none;
            line-height: 1.5;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }
        #gameover-overlay { display: none; }
        #gameover-overlay .final-score {
            color: #ff2fd0;
            text-shadow: 0 0 10px rgba(255,47,208,0.8);
            font-size: 1.8rem;
            margin: 8px 0 16px;
        }
        .btn-start {
            background: linear-gradient(180deg, #00f0ff, #0090a8);
            color: #001014;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 0 12px rgba(0,240,255,0.6);
        }
        .btn-start:active { opacity: 0.7; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <p>NEON DRIFT</p>
        <div class="sub">TILT WRIST TO STEER<br>HOLD GAS TO ACCELERATE<br>JUMP SPIKES &middot; BLAST TRAFFIC</div>
        <button class="btn-start" onclick="initSensors()">ENABLE MOTION &amp; DRIVE</button>
    </div>

    <div id="gameover-overlay">
        <p>WIPEOUT</p>
        <div class="final-score" id="final-score-val">0</div>
        <button class="btn-start" onclick="restartGame()">RESTART</button>
    </div>

    <div id="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div id="combo-val" style="visibility:hidden;">+0</div>
        <div id="tilt-debug">TILT: <span id="tilt-val">0&deg;</span></div>
    </div>

    <div id="view-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="jump-flash">JUMP!</div>
    </div>

    <div id="console-tier">
        <div id="speedo-pod">
            <canvas id="speedo-canvas" width="100" height="68"></canvas>
        </div>
        <div id="wheel-pod">
            <div id="steering-wheel">
                <div class="spoke spoke-h"></div>
                <div class="spoke spoke-v"></div>
            </div>
        </div>
    </div>

    <div id="control-bar">
        <button class="ctrl-btn" id="jump-btn"><span class="icon">&#8963;</span>JUMP</button>
        <button class="ctrl-btn" id="gas-btn"><span class="icon">&#9650;</span>GAS</button>
        <button class="ctrl-btn" id="blaster-btn"><span class="icon">&#10038;</span>FIRE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const speedoCanvas = document.getElementById('speedo-canvas');
        const speedoCtx = speedoCanvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');
        const scoreEl = document.getElementById('score-val');
        const tiltEl = document.getElementById('tilt-val');
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const finalScoreEl = document.getElementById('final-score-val');
        const gasBtn = document.getElementById('gas-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const blasterBtn = document.getElementById('blaster-btn');
        const jumpFlash = document.getElementById('jump-flash');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------- CORE STATE ----------
        let playerX = 0;           // -1 .. 1 across the road
        let score = 0;
        let speed = 0;              // starts at a dead stop
        let currentTargetSpeed = 0;
        const MAX_SPEED = 165;
        let gasHeld = false;
        let gameOver = false;
        let roadTracker = 0;

        let roadCurvature = 0;
        let targetCurvature = 0;
        let curveTimer = 200;
        let driftAngle = 0;
        let isDrifting = false;
        let screenShake = 0;

        let obstacles = [];
        let spawnTimer = 140;

        let projectiles = [];
        let blasterCooldown = 0;
        const BLASTER_COOLDOWN_FRAMES = 16;

        let explosions = [];

        let jumpState = 0;         // 0 = grounded, 0..1 = airborne progress
        let jumpCooldown = 0;
        const JUMP_DURATION = 42;
        const JUMP_COOLDOWN_FRAMES = 12;

        // Steering hardware
        let isDrawing = false;
        let startAngle = 0;
        let currentRotation = 0;
        let baseGamma = null;
        let currentTilt = 0;
        let sensorsActive = false;

        const LANES = [-1, -0.5, 0, 0.5, 1];   // 5 lanes: 2 oncoming, 1 shared, 2 same-direction
        const LANE_HIT_RADIUS = 0.24;
        const LANE_DRAW_SPREAD = 0.42;
        const ROAD_WIDTH_FRAC = 0.92;
        const HORIZON_FRAC = 0.30;
        const VEHICLE_TYPES = ['coupe', 'truck'];

        // ---------- SENSOR / PERMISSION SETUP ----------
        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response == 'granted') {
                            sensorsActive = true;
                            window.addEventListener('deviceorientation', handleMotion);
                        }
                        beginGame();
                    })
                    .catch(() => beginGame());
            } else if (typeof DeviceOrientationEvent !== 'undefined') {
                sensorsActive = true;
                window.addEventListener('deviceorientation', handleMotion);
                beginGame();
            } else {
                beginGame();
            }
        }

        function beginGame() {
            startOverlay.style.display = 'none';
            requestAnimationFrame(loop);
        }

        // gamma = left/right tilt of the device, used purely for steering now
        const TILT_MAX_DEG = 20;
        function handleMotion(event) {
            let gamma = event.gamma;
            if (gamma === null || gamma === undefined) return;
            if (baseGamma === null) baseGamma = gamma;
            let rel = gamma - baseGamma;
            rel = Math.max(-TILT_MAX_DEG, Math.min(TILT_MAX_DEG, rel));
            currentTilt = rel / TILT_MAX_DEG;
            tiltEl.textContent = Math.round(rel) + '\u00b0';

            if (!isDrawing) {
                playerX = currentTilt;
                currentRotation = currentTilt * 1.3;
                wheel.style.transform = `rotate(${currentRotation}rad)`;
            }
        }

        // --- Keyboard fallback for desktop testing ---
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' && !e.repeat) tryJump();
            if ((e.key === 'f' || e.key === 'Enter') && !e.repeat) fireBlaster();
        });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function handleKeyboardFallback() {
            gasHeld = gasHeld || !!keys['ArrowUp'];
            if (keys['ArrowLeft']) {
                currentRotation = Math.max(-1.3, currentRotation - 0.06);
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                playerX = currentRotation / 1.3;
            } else if (keys['ArrowRight']) {
                currentRotation = Math.min(1.3, currentRotation + 0.06);
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                playerX = currentRotation / 1.3;
            }
        }

        // --- GAS button (hold to accelerate, release to coast to 0) ---
        function bindHold(el, onDown, onUp) {
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); el.classList.add('active'); }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); el.classList.remove('active'); }, { passive: false });
            el.addEventListener('touchcancel', () => { onUp(); el.classList.remove('active'); });
            el.addEventListener('mousedown', () => { onDown(); el.classList.add('active'); });
            el.addEventListener('mouseup', () => { onUp(); el.classList.remove('active'); });
            el.addEventListener('mouseleave', () => { onUp(); el.classList.remove('active'); });
        }
        bindHold(gasBtn, () => { gasHeld = true; }, () => { gasHeld = false; });

        function flashBtn(el) {
            el.classList.add('active');
            setTimeout(() => el.classList.remove('active'), 130);
        }
        function bindTap(el, onTap) {
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onTap(); flashBtn(el); }, { passive: false });
            el.addEventListener('mousedown', () => { onTap(); flashBtn(el); });
        }
        bindTap(jumpBtn, tryJump);
        bindTap(blasterBtn, fireBlaster);

        // --- Manual wheel drag (desktop fallback / precision override) ---
        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - center.y, clientX - center.x);
        }
        function steerStart(e) {
            e.preventDefault();
            isDrawing = true;
            startAngle = getAngle(e) - currentRotation;
        }
        function steerMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const angle = getAngle(e);
            currentRotation = angle - startAngle;
            if (currentRotation > 1.3) currentRotation = 1.3;
            if (currentRotation < -1.3) currentRotation = -1.3;
            wheel.style.transform = `rotate(${currentRotation}rad)`;
            playerX = currentRotation / 1.3;
        }
        function steerEnd() {
            isDrawing = false;
            const snapBack = setInterval(() => {
                if (isDrawing) { clearInterval(snapBack); return; }
                currentRotation *= 0.8;
                playerX *= 0.8;
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                if (Math.abs(currentRotation) < 0.01) {
                    currentRotation = 0; playerX = 0;
                    wheel.style.transform = 'rotate(0rad)';
                    clearInterval(snapBack);
                }
            }, 30);
        }
        wheel.addEventListener('touchstart', steerStart, { passive: false });
        window.addEventListener('touchmove', steerMove, { passive: false });
        window.addEventListener('touchend', steerEnd);
        wheel.addEventListener('mousedown', steerStart);
        window.addEventListener('mousemove', steerMove);
        window.addEventListener('mouseup', steerEnd);

        // ---------- JUMP ----------
        function tryJump() {
            if (gameOver || jumpState > 0 || jumpCooldown > 0) return;
            jumpState = 0.0001;
            jumpBtn.classList.add('active-jump');
            jumpFlash.classList.add('show');
            setTimeout(() => jumpFlash.classList.remove('show'), 380);
        }

        // ---------- BLASTER ----------
        function fireBlaster() {
            if (gameOver || blasterCooldown > 0) return;
            blasterCooldown = BLASTER_COOLDOWN_FRAMES;
            projectiles.push({ lane: playerX, z: 0.04 });
            blasterBtn.classList.add('firing');
            setTimeout(() => blasterBtn.classList.remove('firing'), 100);
        }

        function spawnExplosion(x, y, hue) {
            const particles = [];
            const count = 14;
            for (let i = 0; i < count; i++) {
                particles.push({
                    angle: Math.random() * Math.PI * 2,
                    dist: 0,
                    speed: 1 + Math.random() * 3,
                    size: 2 + Math.random() * 3.5
                });
            }
            explosions.push({ x, y, life: 1, particles, hue: hue || (Math.random() < 0.5 ? '#00f0ff' : '#ff2fd0') });
        }

        // ---------- RESET / GAME OVER ----------
        function resetState() {
            playerX = 0;
            score = 0;
            speed = 0;
            currentTargetSpeed = 0;
            gasHeld = false;
            gameOver = false;
            roadTracker = 0;
            roadCurvature = 0;
            targetCurvature = 0;
            curveTimer = 200;
            driftAngle = 0;
            isDrifting = false;
            screenShake = 0;
            obstacles = [];
            spawnTimer = 140;
            projectiles = [];
            blasterCooldown = 0;
            explosions = [];
            jumpState = 0;
            jumpCooldown = 0;
            currentRotation = 0;
            wheel.style.transform = 'rotate(0rad)';
            scoreEl.textContent = '0';
        }
        function restartGame() {
            resetState();
            gameoverOverlay.style.display = 'none';
        }
        function triggerCrash() {
            gameOver = true;
            screenShake = 24;
            finalScoreEl.textContent = score;
            setTimeout(() => { gameoverOverlay.style.display = 'flex'; }, 300);
        }

        // Perspective helpers: t = 0 at horizon, t = 1 at the bottom (near camera)
        function roadCenterX(t, w) {
            const curveOffset = roadCurvature * Math.pow(1 - t, 2) * w * 0.9;
            const steerOffset = -playerX * (w * ROAD_WIDTH_FRAC * 0.5) * t;
            return w / 2 + curveOffset + steerOffset;
        }
        function roadWidthAt(t, w) {
            return w * ROAD_WIDTH_FRAC * t;
        }
        function getObstacleScreenPos(o, w, h) {
            const t = 1 - Math.min(1, o.z);
            const cx = roadCenterX(t, w);
            const rw = roadWidthAt(t, w);
            const y = h * HORIZON_FRAC + t * h * (1 - HORIZON_FRAC);
            const size = Math.max(3, w * (0.012 + 0.5 * Math.pow(t, 3)));
            const x = cx + o.lane * rw * LANE_DRAW_SPREAD;
            return { x, y, size, t };
        }
        function obstacleAlpha(o) {
            if (o.z > 0.95) return Math.max(0, Math.min(1, (1.2 - o.z) / 0.25));
            return 1;
        }

        // ---------- SPAWNING ----------
        function spawnObstacle() {
            const laneIdx = Math.floor(Math.random() * LANES.length);
            const lane = LANES[laneIdx];
            let direction = lane < 0 ? -1 : (lane > 0 ? 1 : (Math.random() < 0.5 ? -1 : 1));

            // avoid stacking two obstacles in the same lane right on top of each other
            const blocked = obstacles.some(o => o.lane === lane && o.z > 0.85);
            if (blocked) { spawnTimer = 18; return; }

            const difficulty = Math.min(1, score / 2500);
            const spikeChance = 0.14 + difficulty * 0.08;
            let type;
            if (Math.random() < spikeChance) {
                type = 'spike';
                direction = 0;
            } else {
                type = VEHICLE_TYPES[Math.floor(Math.random() * VEHICLE_TYPES.length)];
            }
            const hue = direction === -1 ? '#ff2fd0' : '#00f0ff';
            obstacles.push({
                lane, type, hue, direction,
                z: 1.2,
                passed: false,
                mouthPhase: Math.random() * Math.PI * 2
            });
        }

        // ---------- UPDATE ----------
        function update() {
            if (gameOver) return;

            handleKeyboardFallback();

            // Gas: 0 at rest, ramps toward MAX_SPEED while held, coasts back to 0 when released
            currentTargetSpeed = gasHeld ? MAX_SPEED : 0;
            speed += (currentTargetSpeed - speed) * 0.07;
            if (speed < 0.05) speed = 0;

            score += Math.floor(speed / 40);
            scoreEl.textContent = score;

            roadTracker += speed * 0.015;
            if (roadTracker >= 1) roadTracker -= 1;

            curveTimer -= speed * 0.05;
            if (curveTimer <= 0) {
                curveTimer = Math.random() * 300 + 220;
                let randTrack = Math.random();
                if (randTrack < 0.35) targetCurvature = -0.7;
                else if (randTrack > 0.65) targetCurvature = 0.7;
                else targetCurvature = 0;
            }
            roadCurvature += (targetCurvature - roadCurvature) * 0.02;

            driftAngle += (currentRotation - driftAngle) * 0.15;
            isDrifting = Math.abs(currentRotation - driftAngle) > 0.1 && speed > 90;
            if (isDrifting) score += 1;

            // Jump progress
            if (jumpState > 0) {
                jumpState += 1 / JUMP_DURATION;
                if (jumpState >= 1) {
                    jumpState = 0;
                    jumpCooldown = JUMP_COOLDOWN_FRAMES;
                    jumpBtn.classList.remove('active-jump');
                }
            }
            if (jumpCooldown > 0) jumpCooldown--;
            if (blasterCooldown > 0) blasterCooldown--;

            // Spawn pacing: generous gaps early, tightens as score grows (keeps a real reaction window)
            spawnTimer -= (speed + 20) * 0.05;
            if (spawnTimer <= 0) {
                const difficulty = Math.min(1, score / 2500);
                const minGap = 95 - difficulty * 45;
                const maxGap = 175 - difficulty * 70;
                spawnTimer = minGap + Math.random() * (maxGap - minGap);
                spawnObstacle();
            }

            // Obstacles: move + collide
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                let baseRate, K;
                if (o.type === 'spike') { baseRate = 0.00080; K = 0; }
                else if (o.direction === -1) { baseRate = 0.00200; K = 65; }   // oncoming traffic closes fast, always
                else { baseRate = 0.00060; K = 10; }                           // same-direction traffic, slow catch-up
                o.z -= (speed + K) * baseRate;

                if (o.z <= 0.09 && o.z > -0.08 && !o.passed) {
                    const dLane = Math.abs(playerX - o.lane);
                    if (dLane < LANE_HIT_RADIUS) {
                        if (o.type === 'spike') {
                            const airborne = jumpState > 0.12 && jumpState < 0.92;
                            o.passed = true;
                            if (airborne) { score += 15; }
                            else { triggerCrash(); }
                        } else {
                            o.passed = true;
                            triggerCrash();
                        }
                    }
                }
                if (o.z <= -0.08) obstacles.splice(i, 1);
            }

            // Projectiles: move + collide
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.z += 0.05;
                let hit = false;
                for (let j = obstacles.length - 1; j >= 0; j--) {
                    const o = obstacles[j];
                    if (o.type === 'spike') continue; // spikes are fixed hazards, not shootable
                    if (Math.abs(p.lane - o.lane) < LANE_HIT_RADIUS && Math.abs(p.z - o.z) < 0.07) {
                        const pos = getObstacleScreenPos(o, canvas.width, canvas.height);
                        spawnExplosion(pos.x, pos.y, o.hue);
                        obstacles.splice(j, 1);
                        score += 25;
                        screenShake = Math.max(screenShake, 6);
                        hit = true;
                        break;
                    }
                }
                if (hit || p.z > 1.05) projectiles.splice(i, 1);
            }

            // Explosions
            for (let i = explosions.length - 1; i >= 0; i--) {
                const ex = explosions[i];
                ex.life -= 0.045;
                ex.particles.forEach(p => p.dist += p.speed);
                if (ex.life <= 0) explosions.splice(i, 1);
            }

            if (screenShake > 0) screenShake *= 0.9;
        }

        // ---------- MAIN VIEWPORT DRAWING ----------

        function drawSky(w, h) {
            const horizonY = h * HORIZON_FRAC;
            const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, '#0a0316');
            skyGrad.addColorStop(0.6, '#2b0f4a');
            skyGrad.addColorStop(1, '#ff2fd0');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, horizonY);

            ctx.save();
            ctx.shadowColor = '#ffdf6b';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ffdf6b';
            ctx.beginPath();
            ctx.arc(w / 2, horizonY - 2, w * 0.14, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#12042a';
            let bx = -20;
            let seed = 13;
            while (bx < w + 20) {
                seed = (seed * 9301 + 49297) % 233280;
                const bw = 10 + (seed % 22);
                seed = (seed * 9301 + 49297) % 233280;
                const bh = 8 + (seed % 40);
                ctx.fillRect(bx, horizonY - bh, bw, bh);
                bx += bw + 3;
            }

            ctx.strokeStyle = 'rgba(0,240,255,0.35)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 5; i++) {
                const y = horizonY - i * 6;
                if (y < 0) break;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
        }

        function drawRoad(w, h) {
            const BANDS = 90;
            const boundaries = [-0.75, -0.25, 0.25, 0.75]; // between the 5 lane centers
            for (let i = 0; i < BANDS; i++) {
                const t0 = Math.pow(i / BANDS, 1.6);
                const t1 = Math.pow((i + 1) / BANDS, 1.6);
                const y0 = h * HORIZON_FRAC + t0 * h * (1 - HORIZON_FRAC);
                const y1 = h * HORIZON_FRAC + t1 * h * (1 - HORIZON_FRAC);
                const tMid = (t0 + t1) / 2;

                const groundShade = Math.floor((tMid * 12 + roadTracker * 12)) % 2 === 0 ? '#140a24' : '#1a0e2e';
                ctx.fillStyle = groundShade;
                ctx.fillRect(0, y0, w, (y1 - y0) + 1);

                const cx = roadCenterX(tMid, w);
                const rw = roadWidthAt(tMid, w);
                ctx.fillStyle = '#20202a';
                ctx.fillRect(cx - rw / 2, y0, rw, (y1 - y0) + 1);

                const rumbleShade = Math.floor((tMid * 16 + roadTracker * 16)) % 2 === 0 ? '#ff2fd0' : '#eeeeee';
                const edgeW = Math.max(2, rw * 0.032);
                ctx.fillStyle = rumbleShade;
                ctx.fillRect(cx - rw / 2, y0, edgeW, (y1 - y0) + 1);
                ctx.fillRect(cx + rw / 2 - edgeW, y0, edgeW, (y1 - y0) + 1);

                // lane markings; index 1 boundary (-0.25) separates the oncoming block from the shared/overtake lane
                boundaries.forEach((b, bi) => {
                    const bx = cx + b * rw * LANE_DRAW_SPREAD;
                    if (bi === 1) {
                        ctx.fillStyle = 'rgba(255,180,40,0.85)';
                        ctx.fillRect(bx - 1.2, y0, 2.4, (y1 - y0) + 1);
                    } else if (Math.floor((tMid * 18 + roadTracker * 18)) % 2 === 0) {
                        ctx.fillStyle = 'rgba(255,255,255,0.45)';
                        const dashW = Math.max(1, rw * 0.012);
                        ctx.fillRect(bx - dashW / 2, y0, dashW, (y1 - y0) + 1);
                    }
                });
            }
        }

        function drawTaillights(x, y, spread, glowColor) {
            ctx.save();
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 8;
            ctx.fillStyle = glowColor;
            const r = Math.max(1, spread * 0.09);
            ctx.beginPath(); ctx.arc(x - spread * 0.32, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + spread * 0.32, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
        function drawHeadlights(x, y, spread, glowColor) {
            ctx.save();
            ctx.shadowColor = '#eaffff';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#eaffff';
            const r = Math.max(1, spread * 0.1);
            ctx.beginPath(); ctx.arc(x - spread * 0.32, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + spread * 0.32, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
        function drawChompMouth(x, y, size, phase) {
            const openness = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(performance.now() * 0.005 + phase));
            const mw = size * 0.52;
            const mh = size * 0.2 * openness;
            const my = y + size * 0.04;
            ctx.save();
            ctx.fillStyle = '#210007';
            ctx.beginPath();
            ctx.ellipse(x, my, mw / 2, mh / 2 + 1, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fdfdfd';
            const teeth = 5;
            for (let i = 0; i < teeth; i++) {
                const tx = x - mw / 2 + (mw / (teeth - 1)) * i;
                ctx.beginPath();
                ctx.moveTo(tx - mw * 0.045, my - mh / 2);
                ctx.lineTo(tx + mw * 0.045, my - mh / 2);
                ctx.lineTo(tx, my - mh / 2 + mh * 0.55);
                ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(tx - mw * 0.045, my + mh / 2);
                ctx.lineTo(tx + mw * 0.045, my + mh / 2);
                ctx.lineTo(tx, my + mh / 2 - mh * 0.55);
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawCoupe(x, y, size, hue, direction, mouthPhase) {
            ctx.save();
            ctx.fillStyle = '#0d0d14';
            ctx.strokeStyle = hue;
            ctx.lineWidth = Math.max(1, size * 0.02);
            ctx.shadowColor = hue;
            ctx.shadowBlur = size * 0.12;

            ctx.beginPath();
            ctx.moveTo(x - size * 0.5, y);
            ctx.lineTo(x - size * 0.42, y - size * 0.32);
            ctx.lineTo(x - size * 0.18, y - size * 0.46);
            ctx.lineTo(x + size * 0.18, y - size * 0.46);
            ctx.lineTo(x + size * 0.42, y - size * 0.32);
            ctx.lineTo(x + size * 0.5, y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            if (direction === -1) drawHeadlights(x, y - size * 0.06, size, hue);
            else drawTaillights(x, y - size * 0.06, size, '#ff1f4a');
            drawChompMouth(x, y - size * 0.02, size, mouthPhase);
            ctx.restore();
        }

        function drawTruck(x, y, size, hue, direction, mouthPhase) {
            ctx.save();
            ctx.fillStyle = '#101018';
            ctx.strokeStyle = hue;
            ctx.lineWidth = Math.max(1, size * 0.02);
            ctx.shadowColor = hue;
            ctx.shadowBlur = size * 0.12;

            ctx.beginPath();
            ctx.rect(x - size * 0.46, y - size * 0.85, size * 0.92, size * 0.85);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = hue;
            ctx.globalAlpha = 0.25;
            ctx.fillRect(x - size * 0.4, y - size * 0.8, size * 0.8, size * 0.14);
            ctx.globalAlpha = 1;

            if (direction === -1) drawHeadlights(x, y - size * 0.12, size * 1.05, hue);
            else drawTaillights(x, y - size * 0.12, size * 1.05, '#ff1f4a');
            drawChompMouth(x, y - size * 0.06, size * 0.95, mouthPhase);
            ctx.restore();
        }

        function drawSpike(x, y, size) {
            ctx.save();
            ctx.fillStyle = '#ff5522';
            ctx.strokeStyle = '#ffdf6b';
            ctx.shadowColor = '#ff5522';
            ctx.shadowBlur = size * 0.25;
            ctx.lineWidth = Math.max(1, size * 0.02);
            const spikes = 5;
            const totalW = size * 1.15;
            for (let i = 0; i < spikes; i++) {
                const sx = x - totalW / 2 + (totalW / spikes) * i + (totalW / spikes) / 2;
                ctx.beginPath();
                ctx.moveTo(sx - totalW / spikes * 0.42, y);
                ctx.lineTo(sx, y - size * 0.52);
                ctx.lineTo(sx + totalW / spikes * 0.42, y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawObstacles(w, h) {
            for (const o of obstacles) {
                if (o.z <= 0 || o.z > 1.2) continue;
                const pos = getObstacleScreenPos(o, w, h);
                const alpha = obstacleAlpha(o);
                ctx.save();
                ctx.globalAlpha = alpha;
                if (o.type === 'spike') drawSpike(pos.x, pos.y, pos.size);
                else if (o.type === 'truck') drawTruck(pos.x, pos.y, pos.size, o.hue, o.direction, o.mouthPhase);
                else drawCoupe(pos.x, pos.y, pos.size, o.hue, o.direction, o.mouthPhase);
                ctx.restore();
            }
        }

        function drawProjectiles(w, h) {
            for (const p of projectiles) {
                if (p.z <= 0 || p.z > 1.05) continue;
                const t = 1 - Math.min(1, p.z);
                const cx = roadCenterX(t, w);
                const rw = roadWidthAt(t, w);
                const y = h * HORIZON_FRAC + t * h * (1 - HORIZON_FRAC);
                const size = Math.max(3, w * (0.01 + 0.4 * Math.pow(t, 3)));
                const x = cx + p.lane * rw * LANE_DRAW_SPREAD;
                ctx.save();
                ctx.shadowColor = '#7CFFF3';
                ctx.shadowBlur = size * 1.2;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 0.5);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, '#7CFFF3');
                grad.addColorStop(1, 'rgba(0,240,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(x, y, size * 0.32, size * 0.55, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawExplosions(w, h) {
            for (const ex of explosions) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ex.life);
                for (const p of ex.particles) {
                    const px = ex.x + Math.cos(p.angle) * p.dist;
                    const py = ex.y + Math.sin(p.angle) * p.dist * 0.6;
                    ctx.fillStyle = ex.hue;
                    ctx.shadowColor = ex.hue;
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(px, py, Math.max(0.5, p.size * ex.life), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Cyberpunk cockpit / dashboard foreground overlay (stays fixed even when the world hops)
        function drawCockpit(w, h) {
            const dashTop = h * 0.82;

            ctx.save();
            ctx.fillStyle = '#05050a';
            ctx.beginPath();
            ctx.moveTo(0, h); ctx.lineTo(0, h * 0.28); ctx.lineTo(w * 0.1, h * 0.4); ctx.lineTo(w * 0.06, h);
            ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(w, h); ctx.lineTo(w, h * 0.28); ctx.lineTo(w * 0.9, h * 0.4); ctx.lineTo(w * 0.94, h);
            ctx.closePath(); ctx.fill();

            ctx.strokeStyle = 'rgba(0,240,255,0.8)';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(w * 0.06, h); ctx.lineTo(w * 0.1, h * 0.4);
            ctx.moveTo(w * 0.94, h); ctx.lineTo(w * 0.9, h * 0.4);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            const dashGrad = ctx.createLinearGradient(0, dashTop, 0, h);
            dashGrad.addColorStop(0, '#0c0c14');
            dashGrad.addColorStop(1, '#020204');
            ctx.fillStyle = dashGrad;
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(0, dashTop + h * 0.02);
            ctx.quadraticCurveTo(w / 2, dashTop - h * 0.02, w, dashTop + h * 0.02);
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(0,240,255,0.9)';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(0, dashTop + h * 0.02);
            ctx.quadraticCurveTo(w / 2, dashTop - h * 0.02, w, dashTop + h * 0.02);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0,240,255,0.35)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 4;
            for (let i = 0; i < 4; i++) {
                const px = w * (0.16 + i * 0.24);
                ctx.beginPath();
                ctx.moveTo(px, dashTop + h * 0.05);
                ctx.lineTo(px, h);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#050508';
            ctx.strokeStyle = 'rgba(0,240,255,0.6)';
            ctx.lineWidth = 1.5;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 6;
            const mw = w * 0.18, mh = h * 0.05;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(w / 2 - mw / 2, h * 0.16, mw, mh, 4);
            else ctx.rect(w / 2 - mw / 2, h * 0.16, mw, mh);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            const w = canvas.width, h = canvas.height;

            ctx.save();
            if (screenShake > 0.3) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }
            let jumpOffset = 0;
            if (jumpState > 0) {
                jumpOffset = Math.sin(Math.min(1, jumpState) * Math.PI) * h * 0.06;
                ctx.translate(0, -jumpOffset);
            }
            drawSky(w, h);
            drawRoad(w, h);
            drawObstacles(w, h);
            drawProjectiles(w, h);
            drawExplosions(w, h);
            ctx.restore();

            ctx.save();
            if (screenShake > 0.3) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }
            drawCockpit(w, h);
            if (gameOver) {
                ctx.fillStyle = 'rgba(20,0,10,0.4)';
                ctx.fillRect(0, 0, w, h);
            }
            ctx.restore();
        }

        // ---------- ANALOG SPEEDOMETER ----------
        function drawSpeedometer() {
            const w = speedoCanvas.width, h = speedoCanvas.height;
            speedoCtx.clearRect(0, 0, w, h);
            const cx = w / 2, cy = h - 4, r = h - 10;

            speedoCtx.save();
            speedoCtx.fillStyle = '#05050a';
            speedoCtx.beginPath();
            speedoCtx.arc(cx, cy, r + 4, Math.PI, Math.PI * 2);
            speedoCtx.fill();

            speedoCtx.strokeStyle = '#00f0ff';
            speedoCtx.lineWidth = 1.2;
            speedoCtx.shadowColor = '#00f0ff';
            speedoCtx.shadowBlur = 3;
            for (let v = 0; v <= MAX_SPEED; v += 20) {
                const angle = Math.PI - (v / MAX_SPEED) * Math.PI;
                const x1 = cx + Math.cos(angle) * (r - 6);
                const y1 = cy - Math.sin(angle) * (r - 6);
                const x2 = cx + Math.cos(angle) * r;
                const y2 = cy - Math.sin(angle) * r;
                speedoCtx.beginPath();
                speedoCtx.moveTo(x1, y1);
                speedoCtx.lineTo(x2, y2);
                speedoCtx.stroke();
            }
            speedoCtx.restore();

            const speedClamped = Math.max(0, Math.min(MAX_SPEED, speed));
            const needleAngle = Math.PI - (speedClamped / MAX_SPEED) * Math.PI;
            const nx = cx + Math.cos(needleAngle) * (r - 4);
            const ny = cy - Math.sin(needleAngle) * (r - 4);

            speedoCtx.save();
            speedoCtx.strokeStyle = '#ff1f3d';
            speedoCtx.shadowColor = '#ff1f3d';
            speedoCtx.shadowBlur = 8;
            speedoCtx.lineWidth = 2.2;
            speedoCtx.beginPath();
            speedoCtx.moveTo(cx, cy);
            speedoCtx.lineTo(nx, ny);
            speedoCtx.stroke();
            speedoCtx.fillStyle = '#ff1f3d';
            speedoCtx.beginPath();
            speedoCtx.arc(cx, cy, 3, 0, Math.PI * 2);
            speedoCtx.fill();
            speedoCtx.restore();

            speedoCtx.save();
            speedoCtx.fillStyle = '#00f0ff';
            speedoCtx.font = 'bold 10px -apple-system, sans-serif';
            speedoCtx.textAlign = 'center';
            speedoCtx.shadowColor = '#00f0ff';
            speedoCtx.shadowBlur = 4;
            speedoCtx.fillText(Math.round(speedClamped) + ' MPH', cx, cy - r * 0.32);
            speedoCtx.restore();
        }

        function loop() {
            update();
            draw();
            drawSpeedometer();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
