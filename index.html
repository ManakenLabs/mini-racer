<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Icy Tower HTML5 - Kenny Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 5 / 6;
            background: #222;
            border: 4px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 2px 2px 0px #000;
        }
        #combo-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff5500;
            padding: 5px;
            border-radius: 5px;
            display: none;
            text-align: center;
            pointer-events: none;
        }
        #combo-bar {
            height: 10px;
            background: #ff5500;
            width: 100%;
            transition: width 0.1s linear;
        }
        #combo-text {
            font-size: 14px;
            margin-bottom: 2px;
            color: #ffaa00;
            text-shadow: 1px 1px 0 #000;
        }
        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        button {
            background: #ff5500;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
            box-shadow: 0 4px 0 #992200;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #992200;
        }
        #hurry-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #ff3300;
            font-weight: bold;
            text-shadow: 3px 3px 0 #000;
            display: none;
            pointer-events: none;
            animation: blink 0.3s infinite alternate;
        }
        @keyframes blink { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="500" height="600"></canvas>
    
    <div class="ui-overlay">
        <div id="score-display">SCORE: 0</div>
        <div id="floor-display">FLOOR: 0</div>
    </div>

    <div id="hurry-text">HURRY UP!</div>

    <div id="combo-container">
        <div id="combo-text">COMBO X2</div>
        <div id="combo-bar"></div>
    </div>

    <div id="menu-overlay">
        <h1 style="color: #ff5500; margin-bottom: 10px; text-shadow: 2px 2px 0 #000;">ICY TOWER</h1>
        <p style="margin-bottom: 20px; font-size: 14px; color: #ccc;">Kenny Edition</p>
        <button id="start-btn">PLAY WITH KEYS</button>
        <button id="gyro-btn" style="background: #00aa66; box-shadow: 0 4px 0 #005522;">PLAY ON IPHONE (TILT)</button>
        <p style="font-size: 11px; margin-top: 15px; color: #888; max-width: 80%;">Keys: Left/Right to run. Space/Up to jump.<br>Mobile: Tilt phone to run. Auto-jumps automatically!</p>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game States
let gameState = 'MENU';
let score = 0;
let highestFloor = 0;
let cameraY = 0;
let scrollSpeed = 0;
let baseScrollSpeed = 0.3;
let hurryTimer = 0;

// Combo System
let comboActive = false;
let comboCount = 0;
let comboClock = 0;
const MAX_COMBO_CLOCK = 100;
let floorsSkippedThisJump = 0;
let lastFloorLanded = 0;
let particles = [];

// Controls Configuration
let useGyro = false;
let tiltAngle = 0;
let keys = {};

// Entities
let player = {
    x: 230,
    y: 500,
    width: 32,
    height: 40,
    vx: 0,
    vy: 0,
    isGrounded: false,
    facing: 1, // 1 = Right, -1 = Left
    speed: 0.4,
    maxVx: 7,
    friction: 0.88,
    gravity: 0.4,
    jumpForce: -9
};

let platforms = [];
const PLATFORM_THICKNESS = 32; // Twice as thick as standard 16px layouts

// Initialize UI Elements
const menuOverlay = document.getElementById('menu-overlay');
const scoreDisplay = document.getElementById('score-display');
const floorDisplay = document.getElementById('floor-display');
const comboContainer = document.getElementById('combo-container');
const comboBar = document.getElementById('combo-bar');
const comboText = document.getElementById('combo-text');
const hurryText = document.getElementById('hurry-text');

// Event Listeners
document.getElementById('start-btn').addEventListener('click', () => startGame(false));
document.getElementById('gyro-btn').addEventListener('click', () => startGame(true));

window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame(gyroRequested) {
    if (gyroRequested) {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        useGyro = true;
                        window.addEventListener('deviceorientation', handleOrientation);
                        initGame();
                    } else {
                        alert("Gyroscope access denied. Reverting to keyboard controls.");
                        initGame();
                    }
                })
                .catch(console.error);
        } else {
            // Android or desktop testing gyro simulations
            useGyro = true;
            window.addEventListener('deviceorientation', handleOrientation);
            initGame();
        }
    } else {
        initGame();
    }
}

function handleOrientation(event) {
    // gamma is the left-to-right tilt in degrees
    if (event.gamma !== null) {
        tiltAngle = event.gamma;
    }
}

function initGame() {
    gameState = 'PLAYING';
    menuOverlay.style.display = 'none';
    score = 0;
    highestFloor = 0;
    cameraY = 0;
    baseScrollSpeed = 0.3;
    scrollSpeed = baseScrollSpeed;
    
    player.x = 230;
    player.y = 500;
    player.vx = 0;
    player.vy = 0;
    lastFloorLanded = 0;
    comboActive = false;
    comboCount = 0;
    particles = [];

    // Build Ground and starting platforms
    platforms = [];
    // Floor 0 (The Ground)
    platforms.push({ x: 0, y: 550, width: canvas.width, label: 0 });
    
    for (let i = 1; i < 30; i++) {
        generatePlatform(i);
    }

    requestAnimationFrame(gameLoop);
}

function generatePlatform(floorNumber) {
    const y = 550 - (floorNumber * 90); // 90px spacing between floors
    let width = Math.max(120, 260 - (floorNumber * 1.5));
    let x = Math.random() * (canvas.width - width - 40) + 20;
    
    // Every 5th floor layout variant
    if (floorNumber % 5 === 0) {
        width = Math.max(90, width - 30);
    }

    platforms.push({ x: x, y: y, width: width, label: floorNumber });
}

// Particle system for combo sparks
function spawnSparks(x, y) {
    const colors = ['#ff3300', '#ffaa00', '#ffff00', '#00ccff', '#ff00ff'];
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            size: Math.random() * 5 + 3,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            life: Math.random() * 20 + 20
        });
    }
}

// Drawing Logic
function drawBackground() {
    // Dark castle brick pattern background
    ctx.fillStyle = '#1c1714';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#120e0c';
    ctx.lineWidth = 2;
    
    // Draw brick grids offset by camera offset
    let startRow = Math.floor(cameraY / 30) - 1;
    let endRow = startRow + Math.ceil(canvas.height / 30) + 2;

    for (let row = startRow; row < endRow; row++) {
        let yPos = (row * 30) - cameraY;
        ctx.beginPath();
        ctx.moveTo(0, yPos);
        ctx.lineTo(canvas.width, yPos);
        ctx.stroke();

        let offset = (row % 2 === 0) ? 0 : 25;
        for (let x = offset; x < canvas.width; x += 50) {
            ctx.beginPath();
            ctx.moveTo(x, yPos);
            ctx.lineTo(x, yPos + 30);
            ctx.stroke();
        }
    }

    // Draw Arched Gothic Windows periodically
    let windowInterval = 400;
    let firstWinIndex = Math.floor(cameraY / windowInterval) - 1;
    for (let i = firstWinIndex; i < firstWinIndex + 3; i++) {
        let winY = (i * windowInterval) + 150 - cameraY;
