<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Drift Racer POV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: -apple-system, sans-serif;
            padding: 4px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 92%;
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            height: 16px;
            z-index: 5;
        }
        #score-val { color: #34c759; }
        #control-mode { color: #a1a1a6; font-size: 0.65rem; }

        #view-wrapper {
            position: relative;
            width: 95vw;
            height: 52vh;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Fixed structural touch alignment container */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        #start-overlay p {
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .btn-start {
            background: #34c759;
            color: #fff;
            border: none;
            width: 100px;
            height: 36px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(52,199,89,0.3);
        }
        .btn-start:active {
            background: #2aa147;
        }

        #wheel-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 32vh;
            position: relative;
        }
        #steering-wheel {
            width: 80px;
            height: 80px;
            border: 8px solid #2d2d30;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 30%, #222 70%);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 3px 5px rgba(0,0,0,0.5);
            touch-action: none;
            z-index: 2;
        }
        #steering-wheel::before {
            content: '';
            width: 18px;
            height: 18px;
            background: #444;
            border: 2px solid #555;
            border-radius: 50%;
            position: absolute;
            z-index: 3;
        }
        .spoke { position: absolute; background: #2d2d30; }
        .spoke-h { width: 64px; height: 6px; top: 37px; left: 0px; }
        .spoke-v { width: 6px; height: 32px; bottom: 0px; left: 37px; }

        .touch-pedal {
            position: absolute;
            bottom: 0;
            width: 48px;
            height: 90%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.2);
            font-size: 0.55rem;
            font-weight: bold;
            border-radius: 6px;
        }
        #brake-zone { left: 4px; background: rgba(255, 59, 48, 0.06); }
        #gas-zone { right: 4px; background: rgba(52, 199, 89, 0.06); }
    </style>
</head>
<body>

    <div id="start-overlay">
        <p>READY TO DRIVE</p>
        <!-- Standard cross-platform touch event declarations -->
        <div class="btn-start" role="button" onclick="startGameCanvas()" ontouchstart="startGameCanvas()">LAUNCH</div>
    </div>

    <div id="hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div id="control-mode">MODE: TOUCH</div>
        <div><span id="speed-val">0</span> MPH</div>
    </div>

    <div id="view-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="wheel-container">
        <div id="brake-zone" class="touch-pedal">BRAKE</div>
        <div id="steering-wheel">
            <div class="spoke spoke-h"></div>
            <div class="spoke spoke-v"></div>
        </div>
        <div id="gas-zone" class="touch-pedal">GAS</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wheel = document.getElementById('steering-wheel');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let playerX = 0; 
        let score = 0;
        let speed = 20; 
        let baseSpeed = 40;
        let currentTargetSpeed = 40;
        let gameOver = false;
        let roadTracker = 0;

        let roadCurvature = 0;      
        let targetCurvature = 0;    
        let curveTimer = 0;
        let trackPosition = 0;      
        let driftAngle = 0;         
        let isDrifting = false;
        let screenShake = 0;

        let obstacles = [];
        let spawnTimer = 0;

        let isDrawing = false;
        let startAngle = 0;
        let currentRotation = 0;
        let gameActive = false;

        function startGameCanvas() {
            if (gameActive) return;
            gameActive = true;
            
            document.getElementById('start-overlay').style.display = 'none';
            resizeCanvas();
            setupTouchPedals();
            
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if(res === 'granted') {
                        window.addEventListener('deviceorientation', (e) => {
                            let pitch = e.beta;
                            if (pitch > 45) currentTargetSpeed = Math.min(160, baseSpeed + (pitch - 45) * 3);
                            if (pitch < 30) currentTargetSpeed = Math.max(10, baseSpeed - (30 - pitch) * 3);
                            document.getElementById('control-mode').textContent = "MODE: TILT";
                        });
                    }
                }).catch(() => {});
            }
            
            requestAnimationFrame(gameLoop);
        }

        function setupTouchPedals() {
            const gas = document.getElementById('gas-zone');
            const brake = document.getElementById('brake-zone');

            gas.addEventListener('touchstart', (e) => { e.preventDefault(); currentTargetSpeed = 150; });
            gas.addEventListener('touchend', (e) => { e.preventDefault(); currentTargetSpeed = baseSpeed; });
            brake.addEventListener('touchstart', (e) => { e.preventDefault(); currentTargetSpeed = 15; });
            brake.addEventListener('touchend', (e) => { e.preventDefault(); currentTargetSpeed = baseSpeed; });
        }

        function getAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - center.y, clientX - center.x);
        }

        wheel.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            startAngle = getAngle(e) - currentRotation;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const angle = getAngle(e);
            currentRotation = angle - startAngle;
            
            if (currentRotation > 1.3) currentRotation = 1.3;
            if (currentRotation < -1.3) currentRotation = -1.3;

            wheel.style.transform = `rotate(${currentRotation}rad)`;
            playerX = -currentRotation * 1.8;
        });

        window.addEventListener('touchend', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const snapBack = setInterval(() => {
                if (isDrawing) { clearInterval(snapBack); return; }
                currentRotation *= 0.75;
                playerX *= 0.75;
                wheel.style.transform = `rotate(${currentRotation}rad)`;
                if (Math.abs(currentRotation) < 0.01) {
                    currentRotation = 0; playerX = 0;
                    wheel.style.transform = 'rotate(0rad)';
                    clearInterval(snapBack);
                }
            }, 30);
        });

        function update() {
            if (gameOver || !gameActive) return;

            speed += (currentTargetSpeed - speed) * 0.08;
            score += Math.floor(speed / 35);
            document.getElementById('score-val').textContent = score;
